<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مزايا - منصة استيراد B2B</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo;background:#7c3aed}</style>
</head>
<body class="bg-[#7c3aed]">
<div class="max-w-[430px] mx-auto bg-[#f3f0ff] min-h-screen pb-[80px] relative">

<div class="bg-gradient-to-b from-[#a78bfa] to-[#7c3aed] p-4 pb-5 rounded-b-[28px]">
<div class="flex justify-between">
<div class="flex gap-2"><div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white">🔔</div><div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white">☰</div></div>
<div class="text-right text-white"><div class="font-black text-xl flex items-center gap-2 justify-end">مرحباً، أحمد <span class="w-6 h-6 bg-white text-[#7c3aed] rounded-md flex items-center justify-center text-[10px] font-black">M</span></div><div class="text-[13px] opacity-80">جاهز لطلبات الجملة اليوم؟</div></div>
</div>
<div class="mt-4 bg-[#2e1065] rounded-[18px] p-4 flex justify-between items-center">
<div class="text-white"><div class="font-black text-[15px]">توصيل سريع لجميع محافظات<br>العراق</div><div class="text-[10px] opacity-60 mt-1">طلبات جملة تشحن خلال 24-48 ساعة</div></div>
<div class="text-3xl">🚚</div>
</div>
<div class="mt-4 bg-white rounded-full flex items-center px-4 py-3 shadow-xl"><div class="w-9 h-9 bg-[#f3f0ff] rounded-full flex items-center justify-center ml-2">⚙️</div><input id="search" oninput="doFilter()" placeholder="ابحث عن منتج، فئة، أو رمز المنتج..." class="flex-1 bg-transparent outline-none text-[12px]"><span>🔍</span></div>
</div>

<div class="px-4 mt-4"><div class="flex justify-between"><b class="text-[#1e1b4b]">الفئات</b><b class="text-[13px] border-b-2">عرض الكل</b></div><div class="flex gap-2 mt-3 overflow-auto" id="cats" style="scrollbar-width:none"></div></div>

<div class="px-4 mt-5"><div class="flex justify-between"><b class="text-[#1e1b4b]">منتجات الجملة المميزة</b><span class="text-xs text-gray-500">(42) عرض الكل</span></div><div class="grid grid-cols-2 gap-3 mt-3" id="grid"></div></div>

<div class="fixed bottom-0 w-full max-w-[430px] left-1/2 -translate-x-1/2 bg-white rounded-t-[22px] flex justify-around py-2 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] z-40">
<a href="admin.html" class="flex flex-col items-center text-gray-400"><span>📊</span><span class="text-[10px]">التحكم</span></a>
<button class="flex flex-col items-center px-4 py-1 bg-[#2e1065] text-white rounded-xl"><span>🏠</span><span class="text-[10px]">الرئيسية</span></button>
<button onclick="openCart()" class="flex flex-col items-center text-gray-400 relative"><span>🛒</span><span class="text-[10px]">السلة</span><span id="cartDot" class="absolute -top-1 right-2 w-2 h-2 bg-red-500 rounded-full hidden"></span></button>
</div>

<div id="drawer" class="fixed inset-0 bg-black/50 z-50 hidden"><div class="absolute bottom-0 w-full max-w-[430px] left-1/2 -translate-x-1/2 bg-white rounded-t-[24px] p-4 max-h-[85vh] flex flex-col"><div class="flex justify-between font-black text-lg"><span>السلة (<span id="cq">0</span>)</span><span onclick="closeCart()">✕</span></div><div id="clist" class="flex-1 overflow-auto mt-3 space-y-2"></div><div class="border-t pt-3"><div class="flex justify-between font-black"><span>المجموع:</span><span id="tot" class="text-[#7c3aed]">0 د.ع</span></div><input id="cname" placeholder="الاسم" class="w-full mt-2 p-3 border rounded-xl text-xs"><input id="caddr" placeholder="العنوان - المحافظة" class="w-full mt-2 p-3 border rounded-xl text-xs"><button onclick="sendWA()" class="w-full mt-3 bg-[#25D366] text-white py-3 rounded-full font-black">اطلب واتساب 07708265111 ✅</button></div></div></div>

</div>
<script>
const WA="9647708265111"; let active="الالكترونيات"; let categories=["الالكترونيات","قرطاسية","ملابس","مواد غذائية","مواد تجميل","مواد تجميل"];
let products=[
{id:0,n:"سماعات بلوتوث لاسلكية Pro",p:25000,s:120,c:"الالكترونيات",i:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",t:"أكثر مبيعا",cl:"bg-[#7c3aed]"},
{id:1,n:"ميزان رقمي دقيق 10كغ",p:18500,s:85,c:"قرطاسية",i:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400",t:"عرض خاص",cl:"bg-orange-400"},
{id:2,n:"مرطب بشرة بالهايلورونيك 100ml",p:12000,s:200,c:"مواد تجميل",i:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400",t:"جديد",cl:"bg-blue-400"},
{id:3,n:"دفتر ملاحظات A5 - 5 قطع",p:7500,s:50,c:"قرطاسية",i:"https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=400",t:"",cl:""},
{id:4,n:"ميزان مطبخ رقمي",p:16500,s:90,c:"الالكترونيات",i:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400",t:"سعر الجملة",cl:"bg-[#7c3aed]"},
{id:5,n:"حامل موبايل سيارة",p:8000,s:250,c:"الالكترونيات",i:"https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=400",t:"جديد",cl:"bg-blue-400"}
];
let cart=[];
function renderCats(){document.getElementById("cats").innerHTML=categories.map(x=>`<button onclick="setCat('${x}')" class="${active===x?'bg-[#2e1065] text-white':'bg-white text-gray-600 border'} px-4 py-2 rounded-full text-[11px] font-bold whitespace-nowrap">${x}</button>`).join("")}
function setCat(x){active=x;renderCats();doFilter()}
function render(list){document.getElementById("grid").innerHTML=list.map(p=>`<div class="bg-white rounded-[18px] p-3 border shadow-sm"><div class="h-5">${p.t?`<span class="${p.cl} text-white text-[9px] px-2 py-1 rounded-full">${p.t}</span>`:``}</div><img src="${p.i}" class="w-full h-28 object-contain"><div class="text-[10px] text-gray-400 mt-2">سعر الجملة:</div><div class="font-bold text-[12px] text-[#1e1b4b]">${p.n}</div><div class="font-black text-[#7c3aed]">${p.p.toLocaleString()} د.ع</div><div class="text-[10px] text-green-600">● متوفر ${p.s}</div><button onclick="add(${p.id})" class="w-full mt-2 bg-[#2e1065] text-white py-2 rounded-full text-[11px] font-bold">🛒 إضافة للسلة +</button></div>`).join("")}
function doFilter(){let q=document.getElementById("search").value;render(products.filter(p=>p.n.includes(q)))}
function add(id){let ex=cart.find(c=>c.id===id);if(ex)ex.q++;else cart.push({id,q:1});up();openCart()}
function up(){let tq=cart.reduce((s,c)=>s+c.q,0);document.getElementById("cq").innerText=tq;document.getElementById("cartDot").style.display=tq?"block":"none";document.getElementById("tot").innerText=cart.reduce((s,c)=>s+products.find(p=>p.id===c.id).p*c.q,0).toLocaleString()+" د.ع";document.getElementById("clist").innerHTML=cart.map(c=>{let p=products.find(x=>x.id===c.id);return `<div class="flex gap-2 bg-[#f3f0ff] p-2 rounded-xl text-xs"><img src="${p.i}" class="w-12 h-12 bg-white rounded"><div class="flex-1"><b>${p.n}</b><div>${p.p} × ${c.q}</div></div><button onclick="cart=cart.filter(x=>x.id!==${c.id});up()">✕</button></div>`}).join("")}
function openCart(){document.getElementById("drawer").classList.remove("hidden")}function closeCart(){document.getElementById("drawer").classList.add("hidden")}
function sendWA(){let m=`طلب جديد:%0A`;cart.forEach(c=>{let p=products.find(x=>x.id===c.id);m+=`• ${p.n} × ${c.q}%0A`});m+=`المجموع: ${document.getElementById("tot").innerText}%0Aالاسم: ${document.getElementById("cname").value}%0Aالعنوان: ${document.getElementById("caddr").value}`;window.open(`https://wa.me/${WA}?text=${m}`)}
renderCats();render(products);
</script>
</body>
</html>
