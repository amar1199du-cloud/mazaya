<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ادارة الربح الادنى والاكثر</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo}</style>
</head>
<body class="bg-[#0f0e1f] text-white p-3 min-h-screen">
<div class="max-w-[600px] mx-auto">

<div class="flex justify-between mb-4"><a href="index.html" class="bg-white text-black px-4 py-2 rounded-full text-xs font-bold">← المتجر</a><div class="font-black text-sm">الربح الادنى والاكثر <span id="totalCount" class="bg-[#7c3aed] px-2 py-1 rounded-full text-xs">0</span></div></div>

<div class="bg-[#1c1a33] p-4 rounded-2xl border border-[#2a2750] mb-4">
<div class="font-bold text-sm mb-2">⚙️ تحديد ربح موحد لكل المنتجات</div>
<div class="grid grid-cols-2 gap-2">
<input id="globalMin" type="number" placeholder="اقل ربح - 3000" class="p-3 rounded-xl bg-[#211f3f] border text-xs">
<input id="globalMax" type="number" placeholder="اكثر ربح - 15000" class="p-3 rounded-xl bg-[#211f3f] border text-xs">
</div>
<button onclick="applyGlobal()" class="w-full mt-2 bg-[#7c3aed] py-2.5 rounded-xl font-bold text-xs">طبق الادنى والاكثر على كل الـ 500 ✅</button>
</div>

<div class="bg-[#1c1a33] p-4 rounded-2xl border border-[#2a2750] mb-4">
<div class="font-bold text-sm mb-2">📥 استيراد Excel مع الادنى والاكثر</div>
<div class="text-[10px] opacity-60 mb-2">الاعمدة: الاسم | جملة | بيع | اقل ربح | اكثر ربح | الصنف | الصورة | الكمية</div>
<input type="file" id="excelFile" accept=".xlsx,.xls,.csv" class="w-full p-2 bg-[#211f3f] rounded-xl text-xs mb-2">
<button onclick="importExcel()" class="w-full bg-green-600 py-2.5 rounded-xl font-bold text-xs">استيراد 📥</button>
<div class="flex gap-2 mt-2"><button onclick="downloadTemplate()" class="flex-1 bg-[#211f3f] py-2 rounded-xl text-[10px] border">نموذج Excel 📄</button><button onclick="exportProducts()" class="flex-1 bg-[#211f3f] py-2 rounded-xl text-[10px] border">تصدير 📤</button></div>
</div>

<div class="bg-[#1c1a33] p-4 rounded-2xl border border-[#2a2750] mb-4">
<div class="font-bold text-sm mb-3">➕ اضافة منتج مع حدين الربح</div>
<input id="pName" placeholder="اسم المنتج" class="w-full p-3 rounded-xl bg-[#211f3f] border text-xs mb-2">
<div class="grid grid-cols-2 gap-2 mb-2"><input id="pWhole" type="number" placeholder="سعر الجملة" class="p-3 rounded-xl bg-[#211f3f] border text-xs"><input id="pSell" type="number" placeholder="سعر البيع المقترح" class="p-3 rounded-xl bg-[#211f3f] border text-xs"></div>
<div class="grid grid-cols-2 gap-2 mb-2"><input id="pMin" type="number" placeholder="اقل ربح 3000" class="p-3 rounded-xl bg-red-900/30 border border-red-500/30 text-xs"><input id="pMax" type="number" placeholder="اكثر ربح 15000" class="p-3 rounded-xl bg-green-900/30 border border-green-500/30 text-xs"></div>
<select id="pCat" class="w-full p-3 rounded-xl bg-[#211f3f] border text-xs mb-2"><option>الكترونيات</option><option>اجهزة المنزل</option><option>اجهزة المطبخ</option><option>منتجات العنايه</option><option>العاب</option><option>ادوات السيارات</option><option>عدد وادوات</option><option>ادوات رياضية</option><option>اثاث</option><option>انارة و اضاءة</option><option>ادوات منزلية</option><option>ادوات مطبخ</option></select>
<input id="pImg" placeholder="رابط الصورة" class="w-full p-3 rounded-xl bg-[#211f3f] border text-xs mb-2">
<button onclick="addOne()" class="w-full bg-[#7c3aed] py-3 rounded-xl font-black text-xs">اضافة ✅</button>
</div>

<div class="flex gap-2 mb-3"><input id="searchBox" oninput="render()" placeholder="ابحث..." class="flex-1 p-3 rounded-xl bg-[#1c1a33] border text-xs"><select id="filterCat" onchange="render()" class="p-3 rounded-xl bg-[#1c1a33] border text-xs"><option value="">الكل</option><option>الكترونيات</option><option>اجهزة المنزل</option><option>اجهزة المطبخ</option><option>منتجات العنايه</option><option>العاب</option><option>ادوات السيارات</option><option>عدد وادوات</option><option>ادوات رياضية</option><option>اثاث</option><option>انارة و اضاءة</option><option>ادوات منزلية</option><option>ادوات مطبخ</option></select></div>
<div id="list" class="space-y-2 pb-10"></div>
</div>
<script>
function getP(){return JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");}
function saveP(p){localStorage.setItem("mazaya_custom_products",JSON.stringify(p));render();}
function addOne(){
let n=document.getElementById("pName").value.trim();
let w=parseInt(document.getElementById("pWhole").value)||0;
let s=parseInt(document.getElementById("pSell").value)||0;
let minP=parseInt(document.getElementById("pMin").value)||3000;
let maxP=parseInt(document.getElementById("pMax").value)||15000;
let c=document.getElementById("pCat").value;
let img=document.getElementById("pImg").value.trim()||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400";
if(!n||!w){alert("اسم وجملة");return;}
let arr=getP(); arr.push({id:Date.now(),n,whole:w,sell:s||w+minP,c,i:img,s:50,minProfit:minP,maxProfit:maxP}); saveP(arr);
document.getElementById("pName").value="";document.getElementById("pWhole").value="";document.getElementById("pSell").value="";document.getElementById("pMin").value="";document.getElementById("pMax").value="";
}
function applyGlobal(){
let minP=parseInt(document.getElementById("globalMin").value)||3000;
let maxP=parseInt(document.getElementById("globalMax").value)||15000;
if(!confirm("تطبق اقل ربح "+minP+" واكثر ربح "+maxP+" على الكل؟"))return;
let arr=getP(); arr=arr.map(p=>({...p,minProfit:minP,maxProfit:maxP, sell: Math.min(Math.max(p.sell||p.whole+minP, p.whole+minP), p.whole+maxP)})); saveP(arr); alert("تم على "+arr.length);
}
function importExcel(){
let file=document.getElementById("excelFile").files[0]; if(!file){alert("اختار ملف");return;}
let reader=new FileReader();
reader.onload=function(e){
let data=new Uint8Array(e.target.result); let wb=XLSX.read(data,{type:"array"}); let sheet=wb.Sheets[wb.SheetNames[0]]; let json=XLSX.utils.sheet_to_json(sheet);
let arr=getP(); let c=0;
json.forEach(row=>{
let name=row["الاسم"]||Object.values(row)[0]; let whole=row["سعر الجملة"]||Object.values(row)[1]; let sell=row["سعر البيع"]||Object.values(row)[2]; let minP=row["اقل ربح"]||3000; let maxP=row["اكثر ربح"]||15000; let cat=row["الصنف"]||"جميع المنتجات"; let img=row["رابط الصورة"]||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"; let stock=row["الكمية"]||50;
if(name&&whole){arr.push({id:Date.now()+c++,n:String(name),whole:parseInt(whole),sell:parseInt(sell)||parseInt(whole)+parseInt(minP),c:String(cat),i:String(img),s:parseInt(stock)||50,minProfit:parseInt(minP)||3000,maxProfit:parseInt(maxP)||15000});}
}); saveP(arr); alert("تم "+c);
}; reader.readAsArrayBuffer(file);
}
function downloadTemplate(){let data=[["الاسم","سعر الجملة","سعر البيع","اقل ربح","اكثر ربح","الصنف","رابط الصورة","الكمية"],["ميزان مطبخ",16500,25000,3000,10000,"اجهزة المطبخ","https://...jpg",100]]; let ws=XLSX.utils.aoa_to_sheet(data); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"منتجات"); XLSX.writeFile(wb,"مزايا_الادنى_والاكثر.xlsx");}
function exportProducts(){let arr=getP(); if(!arr.length){alert("ماكو");return;} let ws=XLSX.utils.json_to_sheet(arr.map(p=>({"الاسم":p.n,"سعر الجملة":p.whole,"سعر البيع":p.sell,"اقل ربح":p.minProfit,"اكثر ربح":p.maxProfit,"الصنف":p.c}))); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"منتجات"); XLSX.writeFile(wb,"تصدير_مزايا.xlsx");}
function del(id){if(confirm("حذف؟"))saveP(getP().filter(x=>x.id!==id));}
function render(){
let arr=getP(); let q=document.getElementById("searchBox").value.toLowerCase(); let fc=document.getElementById("filterCat").value;
let filtered=arr.filter(p=>(!q||p.n.toLowerCase().includes(q))&&(!fc||p.c===fc));
document.getElementById("totalCount").innerText=arr.length;
document.getElementById("list").innerHTML=filtered.slice().reverse().map(p=>`<div class="bg-[#1c1a33] p-3 rounded-xl border border-[#2a2750] flex gap-3"><img src="${p.i}" class="w-12 h-12 rounded-xl object-cover"><div class="flex-1 text-[11px]"><div class="font-bold">${p.n}</div><div class="text-[10px] mt-1 opacity-70">${p.c} | جملة ${p.whole.toLocaleString()}</div><div class="flex gap-2 mt-1"><span class="bg-red-900/40 text-red-300 px-2 py-0.5 rounded-full text-[9px]">ادنى ربح ${ (p.minProfit||0).toLocaleString()}</span><span class="bg-green-900/40 text-green-300 px-2 py-0.5 rounded-full text-[9px]">اكثر ربح ${ (p.maxProfit||0).toLocaleString()}</span></div><div class="text-[10px] mt-1">مسموح: من ${(p.whole+(p.minProfit||0)).toLocaleString()} الى ${(p.whole+(p.maxProfit||0)).toLocaleString()}</div></div><button onclick="del(${p.id})" class="text-red-400">✕</button></div>`).join("")||"<div class='text-center opacity-30 text-xs py-10'>ماكو منتجات</div>";
}
render();
</script>
</body>
</html>
