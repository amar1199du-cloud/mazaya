<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مزايا - نظام المروجين</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo;background:#f3f0ff}</style>
</head>
<body class="bg-[#f3f0ff]">
<div class="max-w-[430px] mx-auto bg-[#f3f0ff] min-h-screen pb-[80px] relative overflow-hidden">

<!-- تسجيل دخول مرتب -->
<div id="loginScreen" class="fixed inset-0 z-[999] bg-[#7c3aed] flex items-center justify-center p-5">
<div class="bg-white w-full max-w-[340px] rounded-[32px] p-7 shadow-2xl text-center">
<div class="w-20 h-20 bg-[#2e1065] rounded-[20px] mx-auto flex items-center justify-center text-white font-black text-3xl">M</div>
<div class="font-black text-[22px] mt-4 text-[#1e1b4b]">نظام المروجين</div>
<div class="text-[13px] text-gray-400 mt-1">سجل دخولك كمروج</div>

<div class="mt-6 space-y-3 text-right">
<label class="text-[11px] font-bold text-[#1e1b4b]">اسمك</label>
<input id="promoterName" type="text" placeholder="مثال: عمار" class="w-full p-4 bg-[#f8f7ff] border-2 border-transparent focus:border-[#7c3aed] rounded-2xl outline-none text-sm text-right">
<label class="text-[11px] font-bold text-[#1e1b4b]">رقمك</label>
<input id="promoterPhone" type="tel" placeholder="0770 123 4567" class="w-full p-4 bg-[#f8f7ff] border-2 border-transparent focus:border-[#7c3aed] rounded-2xl outline-none text-sm text-right">
<button onclick="doLogin()" id="loginBtn" class="w-full mt-2 bg-[#2e1065] text-white py-4 rounded-2xl font-black text-[14px]">دخول للمتجر 🚀</button>
<div class="text-[10px] text-gray-400 text-center mt-2">دخول وهمي بسيط - ينحفظ بجهازك فقط</div>
</div>
</div>
</div>

<!-- المتجر -->
<div class="bg-gradient-to-b from-[#a78bfa] to-[#7c3aed] p-4 pb-6 rounded-b-[28px]">
<div class="flex justify-between items-center">
<button onclick="logout()" class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white text-sm">🚪</button>
<div class="text-right text-white flex items-center gap-3">
<div><div id="displayName" class="font-black text-[16px]">مرحباً</div><div id="displayPhone" class="text-[11px] opacity-70"></div></div>
<div class="w-9 h-9 bg-white text-[#7c3aed] rounded-xl flex items-center justify-center font-black text-xs">M</div>
</div>
</div>
<div class="mt-4 bg-white rounded-full flex items-center px-4 py-3.5 shadow-xl"><input id="search" oninput="doFilter()" placeholder="ابحث بين 500 منتج..." class="flex-1 bg-transparent outline-none text-[13px]"><span>🔍</span></div>
</div>

<div class="px-3 mt-4"><b class="text-[#1e1b4b] text-[13px]">الفئات</b><div class="flex gap-2 mt-3 overflow-auto pb-2" id="cats" style="scrollbar-width:none"></div></div>

<div class="px-3 mt-4"><div class="flex justify-between"><div class="font-black text-[#1e1b4b] text-[13px]">المنتجات</div><div id="productCount" class="text-[10px] bg-white px-3 py-1 rounded-full font-bold">0</div></div><div class="grid grid-cols-2 gap-3 mt-3" id="grid"></div></div>

<div class="fixed bottom-0 w-full max-w-[430px] left-1/2 -translate-x-1/2 bg-white rounded-t-[22px] flex justify-around py-3 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] z-30">
<button class="flex flex-col items-center px-8 py-1.5 bg-[#2e1065] text-white rounded-xl"><span>🏠</span><span class="text-[10px]">الرئيسية</span></button>
<button onclick="openCart()" class="flex flex-col items-center px-8 py-1.5 bg-[#f3f0ff] text-[#2e1065] rounded-xl border relative"><span>🛒</span><span class="text-[10px] font-bold">السلة (<span id="cq2">0</span>)</span></button>
</div>

<div id="drawer" class="fixed inset-0 bg-black/50 z-[100] hidden"><div class="absolute bottom-0 w-full max-w-[430px] left-1/2 -translate-x-1/2 bg-white rounded-t-[28px] p-4 max-h-[90vh] flex flex-col">
<div class="flex justify-between font-black text-[15px]"><span>سلة الطلب (<span id="cq">0</span>)</span><span onclick="closeCart()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center cursor-pointer">✕</span></div>
<div id="clist" class="flex-1 overflow-auto mt-3 space-y-3"></div>
<div class="border-t pt-3 mt-3 bg-[#f9f8ff] p-3 rounded-2xl">
<div class="font-black text-[12px] mb-2">بيانات الزبون النهائي:</div>
<input id="cname" placeholder="اسم الزبون *" class="w-full p-3 border rounded-xl text-xs mb-2 outline-none focus:border-[#7c3aed]">
<input id="cphone" placeholder="رقم الزبون 0770... *" class="w-full p-3 border rounded-xl text-xs mb-2 outline-none">
<input id="caddr" placeholder="عنوان الزبون *" class="w-full p-3 border rounded-xl text-xs outline-none">
<div class="flex justify-between font-black mt-3 text-[12px]"><span>مجموع الجملة:</span><span id="totWhole">0</span></div>
<div class="flex justify-between font-black text-[12px]"><span>مجموع البيع:</span><span id="totSell" class="text-[#7c3aed]">0</span></div>
<div class="flex justify-between font-black text-[14px] bg-green-50 p-2.5 rounded-xl mt-1"><span>ربحك:</span><span id="totProfit" class="text-green-600">0</span></div>
<button onclick="sendWA()" class="w-full mt-3 bg-[#25D366] text-white py-4 rounded-full font-black text-sm shadow-lg">ارسال الكليشة واتساب ✅</button>
</div>
</div></div>

</div>
<script>
const WA="9647708265111";
const CATEGORIES=["جميع المنتجات","الكترونيات","اجهزة المنزل","اجهزة المطبخ","منتجات العنايه","العاب","ادوات السيارات","عدد وادوات","ادوات رياضية","اثاث","انارة و اضاءة","ادوات منزلية","ادوات مطبخ"];
let active="جميع المنتجات";
let defaultProducts=[
{id:1,n:"سماعات بلوتوث Pro Max",whole:25000,sell:38000,c:"الكترونيات",i:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",s:120},
{id:2,n:"ميزان مطبخ رقمي",whole:16500,sell:25000,c:"اجهزة المطبخ",i:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400",s:85},
{id:3,n:"مصباح LED ذكي",whole:12000,sell:20000,c:"انارة و اضاءة",i:"https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=400",s:200},
];
let customProducts = JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");
let products = [...defaultProducts,...customProducts];
let cart=[];

function checkLogin(){
let n=localStorage.getItem("mazaya_promoter_name");
let p=localStorage.getItem("mazaya_promoter_phone");
if(n && n.trim()!==""){
document.getElementById("loginScreen").style.display="none";
document.getElementById("displayName").innerText="مرحباً، "+n;
document.getElementById("displayPhone").innerText=p||"";
return true;
}else{
document.getElementById("loginScreen").style.display="flex";
return false;
}
}

function doLogin(){
let n=document.getElementById("promoterName").value.trim();
let p=document.getElementById("promoterPhone").value.trim();
if(!n){alert("اكتب اسمك حبيبي"); document.getElementById("promoterName").focus(); return;}
localStorage.setItem("mazaya_promoter_name",n);
localStorage.setItem("mazaya_promoter_phone",p);
document.getElementById("loginBtn").innerText="تم ✓ جاري الدخول...";
setTimeout(()=>{ checkLogin(); },300);
}

function logout(){
localStorage.removeItem("mazaya_promoter_name");
localStorage.removeItem("mazaya_promoter_phone");
document.getElementById("promoterName").value="";
document.getElementById("promoterPhone").value="";
checkLogin();
}

function renderCats(){document.getElementById("cats").innerHTML=CATEGORIES.map(x=>`<button onclick="setCat('${x}')" class="${active===x?'bg-[#2e1065] text-white shadow':'bg-white text-gray-600 border'} px-4 py-2.5 rounded-full text-[11px] font-bold whitespace-nowrap transition">${x}</button>`).join("")}
function setCat(x){active=x;renderCats();doFilter()}
function render(list){
document.getElementById("productCount").innerText=list.length+" منتج";
document.getElementById("grid").innerHTML=list.map(pr=>`<div class="bg-white rounded-[18px] p-3 border shadow-sm"><img src="${pr.i}" class="w-full h-28 object-contain rounded-xl"><div class="mt-2 font-bold text-[11px] text-[#1e1b4b] h-8 overflow-hidden">${pr.n}</div><div class="mt-2 bg-[#f9f8ff] p-2 rounded-xl border"><div class="text-[9px] text-gray-500">جملة: <b>${pr.whole.toLocaleString()}</b></div><div class="text-[9px] text-[#7c3aed] mt-1">بيع:</div><input type="number" value="${pr.sell}" onchange="updateSell(${pr.id},this.value)" class="w-full bg-white border-2 border-[#ece8ff] focus:border-[#7c3aed] rounded-lg p-1.5 text-[11px] font-black text-[#7c3aed] outline-none"><div class="text-[9px] text-green-600 mt-1 font-bold">ربح ${(pr.sell-pr.whole).toLocaleString()}</div></div><button onclick="add(${pr.id})" class="w-full mt-2 bg-[#2e1065] text-white py-2.5 rounded-full text-[11px] font-bold">إضافة للسلة +</button></div>`).join("")||"<div class='col-span-2 text-center py-10 text-gray-400 text-xs'>ماكو منتجات<br><a href='admin.html' class='text-[#7c3aed] font-bold underline'>افتح لوحة التحكم</a></div>";
}
function updateSell(id,val){let pr=products.find(p=>p.id==id); if(pr){pr.sell=parseInt(val)||pr.whole; let custom=JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]"); let f=custom.find(x=>x.id==id); if(f){f.sell=pr.sell; localStorage.setItem("mazaya_custom_products",JSON.stringify(custom));} up();}}
function doFilter(){customProducts = JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]"); products = [...defaultProducts,...customProducts]; let q=document.getElementById("search").value.toLowerCase(); let f=products.filter(p=>(active==="جميع المنتجات"||p.c===active)&&p.n.toLowerCase().includes(q)); render(f);}
function add(id){let ex=cart.find(c=>c.id==id); if(ex)ex.q++; else cart.push({id,q:1}); up(); openCart();}
function up(){let tq=cart.reduce((s,c)=>s+c.q,0); document.getElementById("cq").innerText=tq; document.getElementById("cq2").innerText=tq; let whole=0,sell=0; document.getElementById("clist").innerHTML=cart.map(c=>{let p=products.find(x=>x.id==c.id); if(!p) return ""; whole+=p.whole*c.q; sell+=p.sell*c.q; return `<div class="bg-[#f9f8ff] p-2.5 rounded-xl border flex gap-2"><img src="${p.i}" class="w-14 h-14 object-contain bg-white rounded-xl border"><div class="flex-1 text-[11px]"><div class="font-bold">${p.n}</div><div class="flex items-center gap-2 mt-1"><input type="number" value="${c.q}" min="1" onchange="cart.find(x=>x.id==${p.id}).q=parseInt(this.value)||1;up()" class="w-12 border-2 rounded-lg p-1 text-center font-bold"> <span class="text-[10px]">كمية</span></div><div class="mt-1 text-[10px]">جملة ${p.whole.toLocaleString()} | بيع <b class="text-[#7c3aed]">${p.sell.toLocaleString()}</b></div></div><button onclick="cart=cart.filter(x=>x.id!=${p.id});up()" class="w-7 h-7 bg-red-50 text-red-500 rounded-full">✕</button></div>`}).join("")||"<div class='text-center text-gray-400 py-6 text-xs'>السلة فارغة</div>"; document.getElementById("totWhole").innerText=whole.toLocaleString()+" د.ع"; document.getElementById("totSell").innerText=sell.toLocaleString()+" د.ع"; document.getElementById("totProfit").innerText=(sell-whole).toLocaleString()+" د.ع";}
function openCart(){doFilter(); document.getElementById("drawer").classList.remove("hidden")}function closeCart(){document.getElementById("drawer").classList.add("hidden")}
function sendWA(){if(!cart.length){alert("السلة فارغة");return;}let cn=document.getElementById("cname").value.trim();let cp=document.getElementById("cphone").value.trim();let ca=document.getElementById("caddr").value.trim();if(!cn||!cp||!ca){alert("املأ بيانات الزبون");return;}let pn=localStorage.getItem("mazaya_promoter_name")||"مروج";let pp=localStorage.getItem("mazaya_promoter_phone")||"";let msg=`*طلب جديد - مزايا*%0A%0A*اسم المروج:* ${pn}%0A*رقم المروج:* ${pp}%0A----------------%0A`;cart.forEach((c,i)=>{let p=products.find(x=>x.id==c.id);if(!p)return;msg+=`%0A*${i+1}. ${p.n}*%0A📸 ${p.i}%0A📦 الكمية: ${c.q}%0A💰 جملة: ${p.whole.toLocaleString()}%0A💵 بيع: ${p.sell.toLocaleString()}%0A📈 ربح: ${((p.sell-p.whole)*c.q).toLocaleString()}%0A`;});msg+=`%0A----------------%0A*مجموع الجملة:* ${document.getElementById("totWhole").innerText}%0A*مجموع البيع:* ${document.getElementById("totSell").innerText}%0A*ربح المروج:* ${document.getElementById("totProfit").innerText}%0A----------------%0A*بيانات الزبون:*%0A👤 ${cn}%0A📞 ${cp}%0A📍 ${ca}%0A`;window.open(`https://wa.me/${WA}?text=${msg}`,"_blank");}

// Enter يدخل
document.getElementById("promoterPhone").addEventListener("keypress",function(e){if(e.key==="Enter")doLogin();});
document.getElementById("promoterName").addEventListener("keypress",function(e){if(e.key==="Enter")document.getElementById("promoterPhone").focus();});

checkLogin();renderCats();render(products);
</script>
</body>
</html>
