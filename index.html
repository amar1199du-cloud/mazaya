<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>مزايا - HEBA STORE 👑</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif}
body{background:#0a0a0f;color:white;overflow-x:hidden}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.08)}
.card-heba{background:linear-gradient(145deg,#1e1e2e,#15151f);border:1px solid rgba(124,58,237,0.15);border-radius:20px;position:relative;overflow:hidden}
.card-heba::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent);animation:shine 3s infinite}
@keyframes shine{0%{left:-100%}50%{left:100%}100%{left:100%}}
.banner-heba{background:linear-gradient(135deg,#2a1450 0%,#3d1e7a 25%,#5b2cc0 60%,#7c3aed 100%);border:1px solid rgba(168,85,247,0.25);position:relative;overflow:hidden}
.banner-heba::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,0.15) 40%,transparent 60%);animation:gloss 4s infinite}
@keyframes gloss{0%{transform:translateX(-100%) rotate(15deg)}100%{transform:translateX(100%) rotate(15deg)}}
.cat-active{background:linear-gradient(135deg,#a855f7,#ec4899);color:white;box-shadow:0 8px 20px rgba(168,85,247,0.35)}
.profit-badge{background:linear-gradient(90deg,#ec4899,#a855f7)}
.bottom-nav{background:rgba(20,20,30,0.92);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1)}
input,select{background:#171721!important;border:1px solid rgba(255,255,255,0.08)!important;color:white!important}
.no-scrollbar::-webkit-scrollbar{display:none}
.login-bg{background:radial-gradient(ellipse at top,#2a1450,#0a0a0f)}
</style>
</head>
<body>
<div class="max-w-[520px] mx-auto min-h-screen pb-28 relative">

<!-- تسجيل الدخول - يطلع اول مرة -->
<div id="loginScreen" class="fixed inset-0 z-[100] login-bg flex items-center justify-center p-6 hidden">
  <div class="w-full max-w-[360px] space-y-5">
    <div class="text-center space-y-3">
      <div class="w-20 h-20 mx-auto rounded-[22px] bg-gradient-to-br from-[#ec4899] to-[#a855f7] flex items-center justify-center font-black text-[28px] shadow-2xl shadow-[#a855f7]/30">M</div>
      <div class="font-black text-[22px]">مرحبا بيك بمزايا 👑</div>
      <div class="text-[12px] opacity-60">سجل دخول حتى نحسب ارباحك وطلباتك</div>
    </div>
    <div class="glass rounded-[20px] p-5 space-y-3">
      <input id="loginName" placeholder="اسمك (مثلا عمار)" class="w-full p-4 rounded-full text-[12px] outline-none">
      <input id="loginPhone" type="tel" placeholder="رقمك (0770...)" class="w-full p-4 rounded-full text-[12px] outline-none">
      <select id="loginCity" class="w-full p-4 rounded-full text-[12px] outline-none"><option>بغداد</option><option>البصرة</option><option>اربيل</option><option>النجف</option><option>كربلاء</option><option>الموصل</option><option>باقي المحافظات</option></select>
      <button onclick="doLogin()" class="w-full bg-gradient-to-r from-[#a855f7] to-[#ec4899] py-4 rounded-full font-black text-[13px]">دخول للمتجر 🚀</button>
    </div>
  </div>
</div>

<!-- هيدر -->
<div style="direction:ltr" class="sticky top-0 z-40 glass p-3 px-4 flex justify-between items-center">
  <div style="direction:rtl" class="flex items-center gap-2.5">
    <div class="w-11 h-11 rounded-[14px] bg-gradient-to-br from-[#ec4899] to-[#a855f7] flex items-center justify-center font-black text-[16px] shadow-lg">M</div>
    <div class="text-right leading-[1.1]"><div class="font-black text-[13px] text-[#d8b4fe]">مزايا</div><div class="font-bold text-[8px] opacity-60 tracking-widest">HEBA STORE</div></div>
  </div>
  <div style="direction:rtl" class="flex items-center gap-2">
    <div class="w-9 h-9 rounded-full bg-[#1e1e2e] border border-white/10 flex items-center justify-center text-[14px]">👤</div>
    <div class="text-right leading-[1.1]"><div id="headerName" class="font-black text-[12px]">عمار</div><div class="text-[9px] opacity-50">اخلا 👑</div></div>
  </div>
</div>

<div class="p-4 space-y-4" id="mainContent">
  <!-- بحث -->
  <div class="relative">
    <input id="searchInput" oninput="renderProducts()" placeholder="إبحث عن الهيبة..." class="w-full p-3.5 pr-12 rounded-full text-[12px] outline-none">
    <div class="absolute right-1 top-1 w-9 h-9 rounded-full bg-gradient-to-br from-[#a855f7] to-[#ec4899] flex items-center justify-center">🔍</div>
  </div>

  <!-- بانر باللمعان -->
  <div class="banner-heba rounded-[22px] p-5 relative">
    <div class="relative flex justify-between items-center">
      <div class="text-right">
        <div class="font-black text-[16px]">🔥 عروض الهيبة اليوم</div>
        <div class="text-[11px] opacity-80 mt-1">خصم يوصل 40% + ربحك مضمون</div>
        <div class="mt-3 bg-white text-[#3b1a8a] text-[10px] font-black px-4 py-2 rounded-full inline-flex">🚚 شحن مجاني لكل العراق</div>
      </div>
      <div class="text-[52px] drop-shadow-xl">👑</div>
    </div>
  </div>

  <!-- الفئات -->
  <div class="space-y-3">
    <div class="flex justify-between items-center"><div class="font-black text-[13px]">الفئات الملكية</div><div class="glass px-3 py-1 rounded-full text-[10px]"><span id="countBadge">0</span> منتج</div></div>
    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
      <button onclick="setCat('all')" id="cat-all" class="cat-active whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-black">الكل</button>
      <button onclick="setCat('الكترونيات')" id="cat-الكترونيات" class="glass whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-bold">الكترونيات</button>
      <button onclick="setCat('اجهزة المنزل')" id="cat-اجهزة المنزل" class="glass whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-bold">اجهزة المنزل</button>
      <button onclick="setCat('اجهزة المطبخ')" id="cat-اجهزة المطبخ" class="glass whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-bold">اجهزة المطبخ</button>
    </div>
  </div>

  <div id="productsGrid" class="grid grid-cols-2 gap-3"></div>
</div>

<!-- صفحة الاعدادات - ارباح وطلبات -->
<div id="settingsPage" class="p-4 space-y-4 hidden">
  <div class="font-black text-[16px]">⚙️ الاعدادات الملكية</div>
  <div class="grid grid-cols-2 gap-3">
    <div class="glass rounded-[18px] p-4 text-center"><div id="totalOrders" class="font-black text-[20px] text-[#a78bfa]">0</div><div class="text-[10px] opacity-60 mt-1">عدد الطلبات</div></div>
    <div class="glass rounded-[18px] p-4 text-center"><div id="totalProfit" class="font-black text-[20px] text-[#ec4899]">0 د.ع</div><div class="text-[10px] opacity-60 mt-1">الربح الكلي</div></div>
  </div>
  <div class="glass rounded-[18px] p-4 space-y-3">
    <div class="font-black text-[12px]">👤 معلوماتك</div>
    <div class="text-[11px] opacity-70">الاسم: <span id="setName">-</span></div>
    <div class="text-[11px] opacity-70">الرقم: <span id="setPhone">-</span></div>
    <div class="text-[11px] opacity-70">المدينة: <span id="setCity">-</span></div>
    <button onclick="logout()" class="w-full mt-2 glass py-2 rounded-full text-[10px]">تسجيل خروج</button>
  </div>
  <div class="glass rounded-[18px] p-4 space-y-2">
    <div class="font-black text-[11px]">💰 اعدادات الربح</div>
    <div class="flex gap-2"><input id="setMinProfit" type="number" placeholder="اقل ربح" class="flex-1 p-2 rounded-full text-[10px]"><input id="setMaxProfit" type="number" placeholder="اعلى ربح" class="flex-1 p-2 rounded-full text-[10px]"></div>
    <button onclick="saveProfitSet()" class="w-full bg-white text-black py-2 rounded-full font-black text-[11px]">حفظ</button>
  </div>
</div>

<!-- بوتوم ناف -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-[480px] bottom-nav rounded-[20px] p-2 flex justify-around items-center z-50">
  <button onclick="showPage('settings')" id="nav-set" class="flex flex-col items-center gap-1 opacity-60"><div class="text-[18px]">⚙️</div><div class="text-[9px] font-bold">الاعدادات</div></button>
  <button onclick="showPage('cart')" class="flex flex-col items-center gap-1 opacity-60 relative"><div class="text-[18px]">🛒</div><div class="text-[9px] font-bold">السلة</div><div id="cartCount" class="absolute -top-1 -right-2 bg-[#a855f7] w-5 h-5 rounded-full text-[10px] flex items-center justify-center font-black">0</div></button>
  <button onclick="showPage('home')" id="nav-home" class="bg-white text-black px-7 py-2 rounded-[14px] flex flex-col items-center"><div class="text-[16px]">🏠</div><div class="text-[9px] font-black">الرئيسية</div></button>
</div>

</div>
<script>
let currentCat='all';
let defaultProducts=[];
let mazayaDB=null;
let remoteProducts=[];
let allCache=[];

function checkLogin(){
  let u=JSON.parse(localStorage.getItem('mazaya_user')||'null');
  if(!u){document.getElementById('loginScreen').classList.remove('hidden');}
  else{
    document.getElementById('headerName').innerText=u.name;
    document.getElementById('setName').innerText=u.name;
    document.getElementById('setPhone').innerText=u.phone;
    document.getElementById('setCity').innerText=u.city;
  }
}
function doLogin(){
  let n=document.getElementById('loginName').value.trim();
  let p=document.getElementById('loginPhone').value.trim();
  let c=document.getElementById('loginCity').value;
  if(!n||!p){alert('اكتب اسمك ورقمك');return;}
  localStorage.setItem('mazaya_user',JSON.stringify({name:n,phone:p,city:c}));
  document.getElementById('loginScreen').classList.add('hidden');
  checkLogin();
}
function logout(){localStorage.removeItem('mazaya_user');location.reload();}
function showPage(page){
  document.getElementById('mainContent').classList.add('hidden');
  document.getElementById('settingsPage').classList.add('hidden');
  document.getElementById('nav-home').className="flex flex-col items-center gap-1 opacity-60";
  document.getElementById('nav-set').className="flex flex-col items-center gap-1 opacity-60";
  if(page=='home'){document.getElementById('mainContent').classList.remove('hidden');document.getElementById('nav-home').className="bg-white text-black px-7 py-2 rounded-[14px] flex flex-col items-center";}
  if(page=='settings'){
    document.getElementById('settingsPage').classList.remove('hidden');
    document.getElementById('nav-set').className="bg-white text-black px-7 py-2 rounded-[14px] flex flex-col items-center";
    document.getElementById('totalOrders').innerText=localStorage.getItem('mazaya_orders')||0;
    document.getElementById('totalProfit').innerText=(parseInt(localStorage.getItem('mazaya_total_profit')||0)).toLocaleString()+' د.ع';
  }
  if(page=='cart'){alert('السلة - اطلب عبر الواتساب');showPage('home');}
}
function saveProfitSet(){localStorage.setItem('mazaya_min_profit',document.getElementById('setMinProfit').value);localStorage.setItem('mazaya_max_profit',document.getElementById('setMaxProfit').value);alert('تم الحفظ ✅');}

function openMazayaDB(){return new Promise((res)=>{let r=indexedDB.open("mazaya1000",2);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("products")) d.createObjectStore("products",{keyPath:"id"});};r.onsuccess=e=>{mazayaDB=e.target.result;res(mazayaDB);};r.onerror=()=>res(null);});}
async function getCustomFromDB(){try{await openMazayaDB();if(!mazayaDB)return[];return await new Promise((res)=>{let tx=mazayaDB.transaction("products","readonly");let s=tx.objectStore("products");let req=s.getAll();req.onsuccess=()=>res(req.result||[]);req.onerror=()=>res([]);});}catch(e){return[];}}
async function getAllProducts(){let customOld=JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");let customNew=await getCustomFromDB();let merged=[...defaultProducts,...customOld,...customNew,...remoteProducts];let map=new Map();merged.forEach(p=>{map.set(p.id,p);});return Array.from(map.values());}
function setCat(c){currentCat=c;document.querySelectorAll('[id^="cat-"]').forEach(b=>{b.className="glass whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-bold";});let btn=document.getElementById('cat-'+c);if(btn) btn.className="cat-active whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-black";renderProducts();}
async function renderProducts(){
  let q=(document.getElementById("searchInput").value||"").toLowerCase();
  let all=await getAllProducts();allCache=all;
  let filtered=all.filter(p=>{let mq=!q||p.n.toLowerCase().includes(q);let mc=currentCat=='all'||p.c==currentCat;return mq&&mc;});
  document.getElementById("countBadge").innerText=filtered.length;
  document.getElementById("productsGrid").innerHTML=filtered.map(p=>{
    let profit=p.sell-(p.whole||p.sell);
    return `<div class="card-heba overflow-hidden"><div class="relative"><img src="${p.i}" loading="lazy" class="w-full h-[150px] object-cover bg-[#0f0f17]"><div class="absolute top-2 left-2 profit-badge text-[8px] font-black px-2.5 py-1 rounded-full">ربح ${profit.toLocaleString()}</div><div class="absolute top-2 right-2 glass text-[8px] px-2.5 py-1 rounded-full">${p.c}</div><div class="absolute bottom-2 left-2 bg-black/70 text-[8px] px-2 py-1 rounded-full">📦 ${p.s||50} قطعة</div></div><div class="p-3"><div class="font-bold text-[11px] leading-[1.3] h-[32px] overflow-hidden text-right">${p.n}</div><div class="flex justify-between items-center mt-3"><div><div class="text-[8px] opacity-50">جملة</div><div class="font-black text-[13px]">${(p.whole||p.sell).toLocaleString()} د.ع</div></div><button onclick="addToCart(${p.id})" class="bg-white text-black text-[10px] font-black px-4 py-2 rounded-full">+ سلة</button></div></div></div>`;
  }).join("")||`<div class="col-span-2 text-center py-16 opacity-30"><div class="text-[40px]">👑</div><div class="text-[11px] mt-2">ما كو منتجات</div></div>`;
}
function addToCart(id){
  let p=allCache.find(x=>x.id==id);if(!p)return;
  let orders=parseInt(localStorage.getItem('mazaya_orders')||0)+1;
  let profit=parseInt(localStorage.getItem('mazaya_total_profit')||0)+(p.sell-(p.whole||p.sell));
  localStorage.setItem('mazaya_orders',orders);localStorage.setItem('mazaya_total_profit',profit);
  let u=JSON.parse(localStorage.getItem('mazaya_user')||'{}');
  let msg=`طلب جديد من ${u.name||'عميل'} - ${u.phone||''}\nالمنتج: ${p.n}\nالسعر: ${p.sell}`;
  window.open(`https://wa.me/9647700000000?text=${encodeURIComponent(msg)}`,"_blank");
}
fetch('./products.json?t='+Date.now()).then(r=>r.json()).then(d=>{remoteProducts=d;renderProducts();}).catch(()=>renderProducts());
checkLogin();openMazayaDB().then(()=>renderProducts());renderProducts();
</script>
</body>
</html>
