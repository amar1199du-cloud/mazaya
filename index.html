<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مزايا للاستيراد - نظام المروجين</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo;background:#7c3aed}.no-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#7c3aed]">
<div class="max-w-[430px] mx-auto bg-[#f3f0ff] min-h-screen pb-[80px] relative">

<div id="loginScreen" class="fixed inset-0 bg-gradient-to-b from-[#a78bfa] to-[#7c3aed] z-[100] flex items-center justify-center p-6 max-w-[430px] left-1/2 -translate-x-1/2">
<div class="bg-white w-full rounded-[28px] p-6 shadow-2xl text-center">
<div class="w-16 h-16 bg-[#2e1065] rounded-2xl mx-auto flex items-center justify-center text-white font-black text-2xl">M</div>
<div class="font-black text-xl mt-4 text-[#1e1b4b]">نظام المروجين</div>
<div class="text-[13px] text-gray-500 mt-1">سجل دخولك كمروج</div>
<div class="mt-6 text-right space-y-3">
<input id="promoterName" placeholder="اسم المروج" class="w-full p-4 border-2 border-[#f3f0ff] rounded-2xl outline-none focus:border-[#7c3aed] text-sm">
<input id="promoterPhone" placeholder="رقم المروج" class="w-full p-4 border-2 border-[#f3f0ff] rounded-2xl outline-none text-sm">
<button onclick="doLogin()" class="w-full bg-[#2e1065] text-white py-4 rounded-2xl font-black">دخول 🚀</button>
</div>
</div>
</div>

<div class="bg-gradient-to-b from-[#a78bfa] to-[#7c3aed] p-4 pb-5 rounded-b-[28px]">
<div class="flex justify-between items-center">
<div onclick="logout()" class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white">🚪</div>
<div class="text-right text-white"><div class="font-black text-[18px] flex items-center gap-2 justify-end"><span id="displayName">مرحباً</span> <span class="w-6 h-6 bg-white text-[#7c3aed] rounded-md flex items-center justify-center text-[10px] font-black">M</span></div><div id="displayPhone" class="text-[11px] opacity-70"></div></div>
</div>
<div class="mt-4 bg-white rounded-full flex items-center px-4 py-3 shadow-xl"><input id="search" oninput="doFilter()" placeholder="ابحث بين 500 منتج..." class="flex-1 bg-transparent outline-none text-[12px]"><span>🔍</span></div>
</div>

<div class="px-3 mt-4"><b class="text-[#1e1b4b] text-[13px]">الفئات</b><div class="flex gap-2 mt-3 overflow-auto no-scrollbar pb-2" id="cats"></div></div>

<div class="px-3 mt-4"><div class="flex justify-between"><div class="font-black text-[#1e1b4b] text-[13px]">المنتجات</div><div id="productCount" class="text-[10px] bg-white px-2 py-1 rounded-full">0 منتج</div></div><div class="grid grid-cols-2 gap-3 mt-3" id="grid"></div></div>

<div class="fixed bottom-0 w-full max-w-[430px] left-1/2 -translate-x-1/2 bg-white rounded-t-[22px] flex justify-around py-3 shadow z-40">
<button class="flex flex-col items-center px-6 py-1 bg-[#2e1065] text-white rounded-xl"><span>🏠</span><span class="text-[10px]">الرئيسية</span></button>
<button onclick="openCart()" class="flex flex-col items-center px-6 py-1 bg-[#f3f0ff] text-[#2e1065] rounded-xl border relative"><span>🛒</span><span class="text-[10px]">السلة (<span id="cq2">0</span>)</span></button>
</div>

<div id="drawer" class="fixed inset-0 bg-black/50 z-50 hidden"><div class="absolute bottom-0 w-full max-w-[430px] left-1/2 -translate-x-1/2 bg-white rounded-t-[24px] p-4 max-h-[90vh] flex flex-col">
<div class="flex justify-between font-black"><span>الطلب (<span id="cq">0</span>)</span><span onclick="closeCart()">✕</span></div>
<div id="clist" class="flex-1 overflow-auto mt-3 space-y-3"></div>
<div class="border-t pt-3 mt-3 bg-[#f9f8ff] p-3 rounded-2xl">
<div class="font-black text-[12px] mb-2">بيانات الزبون:</div>
<input id="cname" placeholder="اسم الزبون *" class="w-full p-3 border rounded-xl text-xs mb-2">
<input id="cphone" placeholder="رقم الزبون *" class="w-full p-3 border rounded-xl text-xs mb-2">
<input id="caddr" placeholder="عنوان الزبون *" class="w-full p-3 border rounded-xl text-xs">
<div class="flex justify-between font-black mt-3 text-[12px]"><span>جملة:</span><span id="totWhole">0</span></div>
<div class="flex justify-between font-black text-[12px]"><span>بيع:</span><span id="totSell" class="text-[#7c3aed]">0</span></div>
<div class="flex justify-between font-black text-[13px] bg-green-50 p-2 rounded-xl mt-1"><span>ربحك:</span><span id="totProfit" class="text-green-600">0</span></div>
<button onclick="sendWA()" class="w-full mt-3 bg-[#25D366] text-white py-4 rounded-full font-black text-sm">ارسال كليشة واتساب ✅</button>
</div>
</div></div>

</div>
<script>
const WA="9647708265111";
const CATEGORIES=["جميع المنتجات","الكترونيات","اجهزة المنزل","اجهزة المطبخ","منتجات العنايه","العاب","ادوات السيارات","عدد وادوات","ادوات رياضية","اثاث","انارة و اضاءة","ادوات منزلية","ادوات مطبخ"];
let active="جميع المنتجات";

// منتجات افتراضية - راح تنضاف فوقها منتجاتك الـ 500 من لوحة التحكم
let defaultProducts=[
{id:1,n:"سماعات بلوتوث Pro Max",whole:25000,sell:38000,c:"الكترونيات",i:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",s:120},
{id:2,n:"ميزان مطبخ رقمي",whole:16500,sell:25000,c:"اجهزة المطبخ",i:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400",s:85},
{id:3,n:"مصباح LED ذكي",whole:12000,sell:20000,c:"انارة و اضاءة",i:"https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=400",s:200},
{id:4,n:"مرطب بشرة",whole:8000,sell:15000,c:"منتجات العنايه",i:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400",s:150},
];

// هنا يقرأ منتجاتك الـ 500 من لوحة التحكم
let customProducts = JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");
let products = [...defaultProducts,...customProducts];

let cart=[];
function checkLogin(){let n=localStorage.getItem("mazaya_promoter_name");let p=localStorage.getItem("mazaya_promoter_phone");if(n){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("displayName").innerText="مرحباً، "+n;document.getElementById("displayPhone").innerText=p||"";}}
function doLogin(){let n=document.getElementById("promoterName").value.trim();let p=document.getElementById("promoterPhone").value.trim();if(!n){alert("اكتب اسمك");return;}localStorage.setItem("mazaya_promoter_name",n);localStorage.setItem("mazaya_promoter_phone",p);checkLogin();}
function logout(){localStorage.removeItem("mazaya_promoter_name");localStorage.removeItem("mazaya_promoter_phone");location.reload();}
function renderCats(){document.getElementById("cats").innerHTML=CATEGORIES.map(x=>`<button onclick="setCat('${x}')" class="${active===x?'bg-[#2e1065] text-white':'bg-white text-gray-600 border'} px-4 py-2.5 rounded-full text-[11px] font-bold whitespace-nowrap">${x}</button>`).join("")}
function setCat(x){active=x;renderCats();doFilter()}
function render(list){
document.getElementById("productCount").innerText=list.length+" منتج";
document.getElementById("grid").innerHTML=list.map(pr=>`<div class="bg-white rounded-[18px] p-3 border shadow-sm"><img src="${pr.i}" class="w-full h-28 object-contain"><div class="mt-2 font-bold text-[11px] text-[#1e1b4b] h-8 overflow-hidden">${pr.n}</div><div class="mt-1 bg-gray-50 p-2 rounded-xl"><div class="text-[9px] text-gray-500">جملة:</div><div class="font-bold text-[11px]">${pr.whole.toLocaleString()} د.ع</div><div class="text-[9px] text-[#7c3aed] mt-1">بيع:</div><input type="number" value="${pr.sell}" onchange="updateSell(${pr.id},this.value)" class="w-full bg-white border border-[#7c3aed] rounded-lg p-1 text-[11px] font-black text-[#7c3aed]"><div class="text-[9px] text-green-600 mt-1">ربح ${(pr.sell-pr.whole).toLocaleString()}</div></div><button onclick="add(${pr.id})" class="w-full mt-2 bg-[#2e1065] text-white py-2.5 rounded-full text-[11px] font-bold">إضافة +</button></div>`).join("")||"<div class='col-span-2 text-center py-10 text-gray-400 text-xs'>ماكو منتجات بهذا الصنف - ضيف من لوحة التحكم<br><a href='admin.html' class='text-[#7
