<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>مزايا - HEBA STORE 👑</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif}
body{background:#0a0a0f;color:white}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.08)}
.card-heba{background:linear-gradient(145deg,#1e1e2e,#15151f);border:1px solid rgba(124,58,237,0.15);border-radius:20px;overflow:hidden;position:relative}
.banner-heba{background:linear-gradient(135deg,#2a1450 0%,#3d1e7a 25%,#5b2cc0 60%,#7c3aed 100%);border:1px solid rgba(168,85,247,0.25);overflow:hidden}
.cat-active{background:linear-gradient(135deg,#a855f7,#ec4899);color:white;box-shadow:0 8px 20px rgba(168,85,247,0.4)}
.profit-badge{background:linear-gradient(90deg,#ec4899,#a855f7)}
.bottom-nav{background:rgba(18,18,28,0.96);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1)}
input,select{background:#171721!important;border:1px solid rgba(255,255,255,0.08)!important;color:white!important}
.no-scrollbar::-webkit-scrollbar{display:none}

/* التاج المتحرك */
@keyframes crownFloat{0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}50%{transform:translateY(-12px) rotate(8deg) scale(1.15)}}
@keyframes crownGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(168,85,247,0.6))}50%{filter:drop-shadow(0 0 25px rgba(236,72,153,0.9))}}
.crown-move{animation:crownFloat 2.5s ease-in-out infinite, crownGlow 2s ease-in-out infinite;display:inline-block}

/* لمعان */
@keyframes glossMove{0%{transform:translateX(-100%) skewX(-20deg)}100%{transform:translateX(200%) skewX(-20deg)}}
.banner-heba::after{content:'';position:absolute;top:0;left:0;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent);animation:glossMove 3.5s infinite}
</style>
</head>
<body>
<div class="max-w-[520px] mx-auto min-h-screen pb-28 relative">

<!-- تسجيل دخول -->
<div id="loginScreen" class="fixed inset-0 z-[100] bg-[#0a0a0f] flex items-center justify-center p-6 hidden">
  <div class="w-full max-w-[360px] space-y-5 text-center">
    <div class="crown-move text-[64px]">👑</div>
    <div class="font-black text-[22px]">مزايا - HEBA STORE</div>
    <div class="text-[11px] opacity-60">دخل معلوماتك حتى نحسب ارباحك</div>
    <div class="glass rounded-[20px] p-5 space-y-3 text-right">
      <input id="loginName" placeholder="اسمك" class="w-full p-4 rounded-full text-[12px] outline-none">
      <input id="loginPhone" type="tel" placeholder="رقمك 0770..." class="w-full p-4 rounded-full text-[12px] outline-none">
      <button onclick="doLogin()" class="w-full bg-gradient-to-r from-[#a855f7] to-[#ec4899] py-4 rounded-full font-black text-[13px]">دخول 👑</button>
    </div>
  </div>
</div>

<!-- هيدر -->
<div class="sticky top-0 z-40 glass p-3 px-4 flex justify-between items-center" style="direction:ltr">
  <div class="flex items-center gap-2" style="direction:rtl">
    <div class="w-11 h-11 rounded-[14px] bg-gradient-to-br from-[#ec4899] to-[#a855f7] flex items-center justify-center font-black">M</div>
    <div class="text-right leading-[1.1]"><div class="font-black text-[13px] text-[#d8b4fe]">مزايا</div><div class="font-bold text-[8px] opacity-60">HEBA STORE</div></div>
  </div>
  <div class="flex items-center gap-2" style="direction:rtl">
    <div id="headerName" class="font-black text-[12px]">عمار</div>
  </div>
</div>

<div id="mainContent" class="p-4 space-y-4">
  <div class="relative"><input id="searchInput" oninput="renderProducts()" placeholder="إبحث عن الهيبة..." class="w-full p-3.5 pr-12 rounded-full text-[12px] outline-none"><div class="absolute right-1 top-1 w-9 h-9 rounded-full bg-gradient-to-br from-[#a855f7] to-[#ec4899] flex items-center justify-center">🔍</div></div>

  <div class="banner-heba rounded-[22px] p-5 relative">
    <div class="flex justify-between items-center relative z-10">
      <div class="text-right"><div class="font-black text-[16px]">🔥 عروض الهيبة اليوم</div><div class="text-[11px] opacity-80 mt-1">خصم يوصل 40% + ربحك مضمون</div><div class="mt-3 bg-white text-[#3b1a8a] text-[10px] font-black px-4 py-2 rounded-full inline-block">🚚 شحن مجاني لكل العراق</div></div>
      <div class="crown-move text-[58px]">👑</div>
    </div>
  </div>

  <div class="flex justify-between items-center"><div class="font-black text-[13px]">الفئات الملكية</div><div class="glass px-3 py-1 rounded-full text-[10px]"><span id="countBadge">0</span> منتج</div></div>
  <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
    <button onclick="setCat('all')" id="cat-all" class="cat-active whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-black">الكل</button>
    <button onclick="setCat('الكترونيات')" id="cat-الكترونيات" class="glass whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-bold">الكترونيات</button>
    <button onclick="setCat('اجهزة المنزل')" id="cat-اجهزة المنزل" class="glass whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-bold">اجهزة المنزل</button>
  </div>

  <div id="productsGrid" class="grid grid-cols-2 gap-3"></div>
</div>

<div id="settingsPage" class="p-4 space-y-4 hidden">
  <div class="font-black text-[16px]">⚙️ الاعدادات</div>
  <div class="grid grid-cols-2 gap-3">
    <div class="glass rounded-[18px] p-4 text-center"><div id="totalOrders" class="font-black text-[20px] text-[#a78bfa]">0</div><div class="text-[10px] opacity-60">الطلبات</div></div>
    <div class="glass rounded-[18px] p-4 text-center"><div id="totalProfit" class="font-black text-[20px] text-[#ec4899]">0</div><div class="text-[10px] opacity-60">الربح</div></div>
  </div>
  <button onclick="logout()" class="w-full glass py-3 rounded-full text-[11px]">تسجيل خروج</button>
</div>

<div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-[480px] bottom-nav rounded-[20px] p-2 flex justify-around items-center z-50">
  <button onclick="showPage('settings')" id="nav-set" class="flex flex-col items-center gap-1 opacity-60"><div class="text-[18px]">⚙️</div><div class="text-[9px] font-bold">الاعدادات</div></button>
  <button onclick="showPage('home')" id="nav-home" class="bg-white text-black px-7 py-2 rounded-[14px] flex flex-col items-center"><div class="text-[16px]">🏠</div><div class="text-[9px] font-black">الرئيسية</div></button>
</div>
</div>

<script>
let currentCat='all';
let remoteProducts=[];
let allCache=[];
let mazayaDB=null;

function openDB(){return new Promise(r=>{let req=indexedDB.open("mazaya1000",2);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("products"))d.createObjectStore("products",{keyPath:"id"})};req.onsuccess=e=>{mazayaDB=e.target.result;r(mazayaDB)};req.onerror=()=>r(null)});}
async function getDBProducts(){try{await openDB();if(!mazayaDB)return[];return await new Promise(res=>{let tx=mazayaDB.transaction("products","readonly");let s=tx.objectStore("products");let q=s.getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}catch(e){return[]}}

async function getAllProducts(){
  let old=JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");
  let dbProds=await getDBProducts();
  let merged=[...old,...dbProds,...remoteProducts];
  let map=new Map();merged.forEach(p=>{if(p&&p.id)map.set(p.id,p)});
  return Array.from(map.values());
}

function checkLogin(){
  let u=JSON.parse(localStorage.getItem('mazaya_user')||'null');
  if(!u){document.getElementById('loginScreen').classList.remove('hidden');}
  else{document.getElementById('headerName').innerText=u.name||'عمار';}
}
function doLogin(){
  let n=document.getElementById('loginName').value.trim();
  let p=document.getElementById('loginPhone').value.trim();
  if(!n||!p){alert('اكتب الاسم والرقم');return;}
  localStorage.setItem('mazaya_user',JSON.stringify({name:n,phone:p}));
  document.getElementById('loginScreen').classList.add('hidden');
  checkLogin();
}
function logout(){localStorage.removeItem('mazaya_user');location.reload();}
function showPage(page){
  let main=document.getElementById('mainContent');
  let set=document.getElementById('settingsPage');
  let nh=document.getElementById('nav-home');
  let ns=document.getElementById('nav-set');
  if(page=='home'){main.classList.remove('hidden');set.classList.add('hidden');nh.className="bg-white text-black px-7 py-2 rounded-[14px] flex flex-col items-center";ns.className="flex flex-col items-center gap-1 opacity-60";}
  if(page=='settings'){main.classList.add('hidden');set.classList.remove('hidden');ns.className="bg-white text-black px-7 py-2 rounded-[14px] flex flex-col items-center";nh.className="flex flex-col items-center gap-1 opacity-60";document.getElementById('totalOrders').innerText=localStorage.getItem('mazaya_orders')||0;document.getElementById('totalProfit').innerText=(parseInt(localStorage.getItem('mazaya_total_profit')||0)).toLocaleString()+' د.ع';}
}
function setCat(c){
  currentCat=c;
  document.querySelectorAll('[id^="cat-"]').forEach(b=>b.className="glass whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-bold");
  let btn=document.getElementById('cat-'+c);if(btn)btn.className="cat-active whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-black";
  renderProducts();
}
async function renderProducts(){
  try{
    let q=(document.getElementById("searchInput")?.value||"").toLowerCase();
    let all=await getAllProducts();allCache=all;
    let filtered=all.filter(p=>{let mq=!q||(p.n||'').toLowerCase().includes(q);let mc=currentCat=='all'||p.c==currentCat;return mq&&mc;});
    let cb=document.getElementById("countBadge");if(cb)cb.innerText=filtered.length;
    let grid=document.getElementById("productsGrid");if(!grid)return;
    grid.innerHTML=filtered.map(p=>{
      let profit=(p.sell||0)-(p.whole||p.sell||0);
      return `<div class="card-heba"><div class="relative"><img src="${p.i||''}" loading="lazy" class="w-full h-[150px] object-cover bg-[#0f0f17]" onerror="this.src='https://via.placeholder.com/200'"><div class="absolute top-2 left-2 profit-badge text-[8px] font-black px-2.5 py-1 rounded-full">ربح ${profit.toLocaleString()}</div><div class="absolute bottom-2 left-2 bg-black/70 text-[8px] px-2 py-1 rounded-full">📦 ${p.s||50}</div></div><div class="p-3"><div class="font-bold text-[11px] h-[32px] overflow-hidden text-right">${p.n||''}</div><div class="flex justify-between items-center mt-3"><div class="font-black text-[13px]">${(p.whole||p.sell||0).toLocaleString()} د.ع</div><button onclick="addToCart(${p.id})" class="bg-white text-black text-[10px] font-black px-4 py-2 rounded-full">+ سلة</button></div></div></div>`;
    }).join("")||`<div class="col-span-2 text-center py-16 opacity-30"><div class="crown-move text-[40px]">👑</div><div class="text-[11px] mt-2">ما كو منتجات - ضيف من لوحة التحكم</div></div>`;
  }catch(e){console.log(e)}
}
function addToCart(id){
  let p=allCache.find(x=>x.id==id);if(!p)return;
  let orders=parseInt(localStorage.getItem('mazaya_orders')||0)+1;
  let profit=parseInt(localStorage.getItem('mazaya_total_profit')||0)+(p.sell-(p.whole||p.sell));
  localStorage.setItem('mazaya_orders',orders);localStorage.setItem('mazaya_total_profit',profit);
  let u=JSON.parse(localStorage.getItem('mazaya_user')||'{}');
  let msg=`طلب جديد من ${u.name||''} ${u.phone||''} - ${p.n}`;
  window.open(`https://wa.me/9647700000000?text=${encodeURIComponent(msg)}`,"_blank");
}

fetch('./products.json?t='+Date.now()).then(r=>r.json()).then(d=>{remoteProducts=d;renderProducts();}).catch(()=>{});
checkLogin();renderProducts();
</script>
</body>
</html>
