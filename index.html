<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مزايا للاستيراد</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo}</style></head><body class="bg-[#f5f3ff]"><div class="max-w-[420px] mx-auto min-h-screen pb-20 bg-[#f5f3ff]"><div class="bg-white p-4 flex justify-between"><div class="flex gap-2"><div class="w-10 h-10 bg-[#f5f3ff] rounded-full flex items-center justify-center">🔔</div><div class="w-10 h-10 bg-[#f5f3ff] rounded-full flex items-center justify-center">☰</div></div><div class="font-black text-xl text-[#1e1b4b]">مزايا للاستيراد</div></div><div class="p-4"><input placeholder="ابحث عن منتج..." class="w-full bg-white rounded-full p-3 shadow-sm text-sm"></div><div class="mx-4 bg-gradient-to-l from-[#4f46e5] to-[#7c3aed] rounded-[20px] p-5 text-white flex justify-between"><div><div class="font-black">توصيل سريع لجميع محافظات العراق</div><div class="text-xs opacity-80 mt-1">طلبات جملة تشحن خلال 24-48 ساعة</div></div><div class="text-4xl">📦</div></div><div class="p-4 grid grid-cols-2 gap-3" id="g"></div></div><script>let p=[{n:"سماعات بلوتوث Pro Max",c:25000,s:120,i:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"},{n:"ميزان مطبخ رقمي 10كغ",c:18500,s:85,i:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400"},{n:"دفتر ملاحظات A5",c:7500,s:50,i:"https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=400"},{n:"مرطب بشرة 100مل",c:12000,s:200,i:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400"}];document.getElementById("g").innerHTML=p.map(x=>`<div class="bg-white rounded-[20px] overflow-hidden shadow-sm"><img src="${x.i}" class="w-full h-32 object-cover"><div class="p-3"><span class="text-[10px] bg-[#f5f3ff] text-[#4f46e5] px-2 py-1 rounded">سعر الجملة:</span><div class="font-bold text-[12px] mt-2">${x.n}</div><div class="text-[#4f46e5] font-black text-sm mt-1">${x.c.toLocaleString()} د.ع</div><div class="text-[10px] text-green-600">● متوفر ${x.s}</div><button class="w-full mt-3 bg-gradient-to-l from-orange-400 to-[#7c3aed] text-white py-2.5 rounded-full text-xs font-black">إضافة للسلة +</button></div></div>`).join("")</script></body></html>
