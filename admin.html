<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم - مزايا | 12 صورة</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{font-family:Cairo}
body{background:#0a0a0f}
.glass{background:rgba(255,255,255,0.07);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.09)}
.card-heba{background:linear-gradient(145deg,#1e1e2e,#171721);border:1px solid rgba(124,58,237,0.14)}
input,textarea,select{background:#171721!important;border:1px solid rgba(255,255,255,0.1)!important;color:white!important}
</style>
</head>
<body class="text-white">
<div class="max-w-[600px] mx-auto min-h-screen pb-10 p-4">
<h1 class="font-black text-center text-[16px] mb-4">👑 ادارة مزايا - رفع 12 صورة من الاستوديو</h1>

<div class="glass rounded-[20px] p-5 space-y-3">
<input type="hidden" id="editId">
<input id="pName" placeholder="* اسم المنتج" class="w-full p-3.5 rounded-xl text-[13px]">
<div class="grid grid-cols-2 gap-3">
<input id="pWhole" type="tel" placeholder="* سعر الجملة" class="w-full p-3.5 rounded-xl">
<input id="pSell" type="tel" placeholder="* سعر البيع" class="w-full p-3.5 rounded-xl">
</div>
<input id="pStock" type="tel" placeholder="الكمية" class="w-full p-3 rounded-xl">

<div class="bg-[#171721] p-3 rounded-xl border border-white/10">
<div class="flex justify-between items-center mb-2">
<span class="font-bold text-[11px]">📸 الصور <span id="count" class="text-[#a78bfa]">(0/12)</span></span>
<label for="fileInput" class="bg-white text-black px-3 py-1 rounded-full text-[10px] font-black cursor-pointer">+ من الاستوديو</label>
</div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<div id="grid" class="grid grid-cols-4 gap-2"></div>
<input id="pUrl" placeholder="او رابط صورة (اختياري)" class="w-full p-2 rounded-xl text-[10px] mt-2 opacity-60">
<div class="text-[8px] opacity-40 mt-1">نصيحة: اختار 3-4 صور بالمرة حتى ما يعلق الايفون. اول صورة هي الرئيسية</div>
</div>

<textarea id="pSpecs" placeholder="المواصفات" class="w-full p-3 rounded-xl h-[60px] text-[11px]"></textarea>
<textarea id="pPromo" placeholder="الوصف الترويجي" class="w-full p-3 rounded-xl h-[60px] text-[11px]"></textarea>

<div id="err" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 p-2 rounded-xl text-[10px]"></div>

<button onclick="saveProduct()" class="w-full bg-gradient-to-r from-[#7c3aed] to-[#ec4899] py-4 rounded-xl font-black">حفظ المنتج ✅</button>
</div>

<div id="list" class="mt-4 space-y-2"></div>
</div>

<script>
let def=[{id:1,n:"ميزان مطبخ",whole:12000,sell:13000,i:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400",images:["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"],s:50}];
let selectedImages=[];

function toNum(v){if(!v)return 0;v=v.toString().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^0-9]/g,'');return parseInt(v)||0;}

function compress(file){
return new Promise(res=>{
 let r=new FileReader();
 r.onload=e=>{
  let img=new Image();
  img.onload=()=>{
   let c=document.createElement('canvas');
   let max=500; let w=img.width,h=img.height;
   if(w>h){if(w>max){h*=max/w;w=max;}}else{if(h>max){w*=max/h;h=max;}}
   c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   res(c.toDataURL('image/jpeg',0.5));
  };
  img.src=e.target.result;
 };
 r.readAsDataURL(file);
});
}

document.getElementById('fileInput').addEventListener('change',async function(){
 if(selectedImages.length + this.files.length > 12){alert("الحد 12");return;}
 for(let f of this.files){
  let comp=await compress(f);
  selectedImages.push(comp);
 }
 renderPreview(); this.value='';
});

function renderPreview(){
 document.getElementById('count').innerText=`(${selectedImages.length}/12)`;
 document.getElementById('grid').innerHTML=selectedImages.map((s,i)=>`<div class="relative rounded-xl overflow-hidden aspect-square bg-[#0f0f17]"><img src="${s}" class="w-full h-full object-cover"><button onclick="selectedImages.splice(${i},1);renderPreview()" class="absolute top-0 right-0 w-5 h-5 bg-red-500 rounded-full text-[9px]">✕</button><button onclick="let x=selectedImages.splice(${i},1)[0];selectedImages.unshift(x);renderPreview()" class="absolute bottom-0 left-0 right-0 bg-black/70 text-[7px] py-1">${i==0?'رئيسية':'اجعله رئيسي'}</button></div>`).join('');
}

function getCustom(){return JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");}
function saveProduct(){
 let name=document.getElementById('pName').value.trim();
 let whole=toNum(document.getElementById('pWhole').value);
 let sell=toNum(document.getElementById('pSell').value);
 if(!name){document.getElementById('err').innerText="اكتب اسم المنتج";document.getElementById('err').classList.remove('hidden');return;}
 if(!whole||!sell){document.getElementById('err').innerText="املأ الجملة والبيع";document.getElementById('err').classList.remove('hidden');return;}
 let url=document.getElementById('pUrl').value.trim();
 let imgs=[...selectedImages]; if(url) imgs.unshift(url);
 if(imgs.length==0) imgs=["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"];
 let id=document.getElementById('editId').value;
 let p={id:id?+id:Date.now(),n:name,whole,sell,i:imgs[0],images:imgs,s:toNum(document.getElementById('pStock').value)||50,specs:document.getElementById('pSpecs').value,promo:document.getElementById('pPromo').value,c:"الكترونيات"};
 let custom=getCustom(); if(id){let idx=custom.findIndex(x=>x.id==id); if(idx>=0) custom[idx]=p; else custom.push(p);} else custom.push(p);
 try{localStorage.setItem("mazaya_custom_products",JSON.stringify(custom));alert("تم حفظ "+imgs.length+" صور ✅"); location.reload();}
 catch(e){alert("الصور كبيرة - قلل العدد الى 3-4");}
}
</script>
</body>
</html>
