<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم - مزايا | HEBA STORE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{font-family:Cairo}
body{background:#0a0a0f;position:relative}
body::before{content:'';position:fixed;top:-20%;left:-10%;width:80%;height:60%;background:radial-gradient(ellipse at center,rgba(124,58,237,0.15) 0%,transparent 70%);pointer-events:none;z-index:-1}
body::after{content:'';position:fixed;bottom:-20%;right:-10%;width:80%;height:60%;background:radial-gradient(ellipse at center,rgba(236,72,153,0.10) 0%,transparent 70%);pointer-events:none;z-index:-1}
.glass{background:rgba(255,255,255,0.07);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.09);box-shadow:0 0 20px rgba(124,58,237,0.08),inset 0 1px 0 rgba(255,255,255,0.08)}
.card-heba{background:linear-gradient(145deg,#1e1e2e,#171721);border:1px solid rgba(124,58,237,0.14);box-shadow:0 6px 24px rgba(0,0,0,0.4),0 0 16px rgba(124,58,237,0.06)}
.text-gradient{background:linear-gradient(90deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.banner-heba{background:linear-gradient(135deg,#1e0f4a 0%,#3b1a8a 35%,#5b21b6 70%,#7c3aed 100%);border:1px solid rgba(168,85,247,0.25);box-shadow:0 10px 40px rgba(124,58,237,0.25)}
.no-scrollbar::-webkit-scrollbar{display:none}
input,textarea,select{background:#171721!important;border:1px solid rgba(255,255,255,0.1)!important;color:white!important}
input:focus,textarea:focus,select:focus{border-color:rgba(124,58,237,0.4)!important;outline:none;box-shadow:0 0 12px rgba(124,58,237,0.15)}
</style>
</head>
<body class="text-white">

<div class="max-w-[600px] mx-auto min-h-screen pb-10">
<!-- الهيدر المضبوط M يسار وعمار يمين -->
<div style="direction:ltr" class="sticky top-0 z-40 glass border-b border-white/10 p-4 flex justify-between items-center">
  <div style="direction:rtl" class="flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#ec4899] to-[#7c3aed] flex items-center justify-center font-black text-[14px] shadow-[0_0_14px_rgba(236,72,153,0.35)]">M</div>
    <div class="text-right"><div class="font-black text-[13px] text-gradient">لوحة التحكم</div><div class="text-[8px] opacity-60 -mt-1">HEBA STORE ADMIN</div></div>
  </div>
  <div style="direction:rtl" class="flex items-center gap-2.5">
    <div class="text-right"><div class="font-black text-[14px]">عمار</div><div class="text-[10px] opacity-50">الادمن 👑</div></div>
    <div class="w-9 h-9 rounded-full bg-[#1e1e2e] border border-white/10 flex items-center justify-center">👤</div>
  </div>
</div>

<div class="p-4 space-y-4">

<div class="banner-heba rounded-[20px] p-4 flex justify-between items-center">
<div><div class="font-black text-[14px]">🔥 عروض الهيبة اليوم</div><div class="text-[11px] opacity-80 mt-1">تحكم كامل بالمنتجات والارباح</div></div>
<div class="text-[36px]">👑</div>
</div>

<div class="grid grid-cols-3 gap-3">
<div class="glass rounded-2xl p-4 text-center"><div class="text-[18px] font-black text-[#a78bfa]" id="totalProducts">0</div><div class="text-[9px] opacity-60 mt-1">المنتجات</div></div>
<div class="glass rounded-2xl p-4 text-center"><div class="text-[18px] font-black text-green-400" id="totalOrdersDash">0</div><div class="text-[9px] opacity-60 mt-1">الطلبات</div></div>
<div class="glass rounded-2xl p-4 text-center"><div class="text-[18px] font-black text-[#ec4899]" id="totalProfitDash">0</div><div class="text-[9px] opacity-60 mt-1">الارباح</div></div>
</div>

<div class="glass rounded-[20px] p-5">
<div class="flex justify-between items-center mb-4"><div class="font-black text-[13px]">➕ اضافة منتج جديد</div><button onclick="clearForm()" class="text-[10px] opacity-50">مسح</button></div>

<input type="hidden" id="editId">
<div class="space-y-3">
<input id="pName" placeholder="اسم المنتج - مثال: ميزان مطبخ رقمي" class="w-full p-3 rounded-xl text-[12px]">

<div class="grid grid-cols-2 gap-3">
<select id="pCat" class="w-full p-3 rounded-xl text-[12px]">
<option>الكترونيات</option><option>اجهزة المنزل</option><option>اجهزة المطبخ</option><option>منتجات العنايه</option><option>العاب</option><option>ادوات السيارات</option>
</select>
<input id="pStock" type="number" placeholder="الكمية - 50" class="w-full p-3 rounded-xl text-[12px]">
</div>

<div class="grid grid-cols-2 gap-3">
<input id="pWhole" type="number" placeholder="سعر الجملة - 12000" class="w-full p-3 rounded-xl text-[12px]">
<input id="pSell" type="number" placeholder="سعر البيع - 15000" class="w-full p-3 rounded-xl text-[12px]">
</div>

<div class="grid grid-cols-2 gap-3">
<input id="pMinProfit" type="number" placeholder="اقل ربح - 1000" class="w-full p-3 rounded-xl text-[12px]">
<input id="pMaxProfit" type="number" placeholder="اعلى ربح - 30000" class="w-full p-3 rounded-xl text-[12px]">
</div>

<input id="pImage" placeholder="رابط الصورة الرئيسية" class="w-full p-3 rounded-xl text-[12px]">
<textarea id="pImages" placeholder="روابط صور اضافية - كل رابط بسطر" class="w-full p-3 rounded-xl text-[11px] h-[60px]"></textarea>

<div class="grid grid-cols-2 gap-3">
<textarea id="pSpecs" placeholder="المواصفات - كل نقطة بسطر&#10;• يتحمل حتى 10 كغم&#10;• شاشة LED" class="w-full p-3 rounded-xl text-[11px] h-[90px]"></textarea>
<textarea id="pPromo" placeholder="الوصف الترويجي&#10;ميزان يجنن للطبخ!" class="w-full p-3 rounded-xl text-[11px] h-[90px]"></textarea>
</div>

<button onclick="saveProduct()" id="saveBtn" class="w-full bg-gradient-to-r from-[#7c3aed] to-[#ec4899] py-4 rounded-xl font-black text-[13px] shadow-[0_0_20px_rgba(124,58,237,0.35)]">حفظ المنتج ✅</button>
</div>
</div>

<div class="flex justify-between items-center px-1">
<div class="font-black text-[12px]">📦 كل المنتجات</div>
<div class="flex gap-2"><input id="searchAdmin" oninput="renderAdmin()" placeholder="بحث..." class="p-2 px-3 rounded-full text-[11px] w-[120px]"><button onclick="exportData()" class="glass px-3 py-2 rounded-full text-[10px]">📤 تصدير</button></div>
</div>

<div id="adminGrid" class="grid grid-cols-1 gap-3"></div>

</div>
</div>

<script>
let defaultProducts=[
{id:1,n:"ميزان مطبخ رقمي ذكي",whole:12000,sell:13000,c:"اجهزة المطبخ",i:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400",images:["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"],s:85,minProfit:1000,maxProfit:30000,specs:"• يتحمل حتى 10 كغم\n• شاشة LED واضحة",promo:"ميزان يجنن!"},
{id:2,n:"سماعات ريلمي ضمان T110",whole:15000,sell:16000,c:"الكترونيات",i:"https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400",images:["https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400"],s:50,minProfit:1000,maxProfit:20000,specs:"• صوت نقي\n• بطارية 18 ساعة",promo:"سماعات اصلية!"}
];

function getAllProducts(){
 let custom=JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");
 return [...defaultProducts,...custom];
}
function getCustomOnly(){return JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");}

function saveProduct(){
 let id=document.getElementById("editId").value;
 let name=document.getElementById("pName").value.trim();
 let cat=document.getElementById("pCat").value;
 let stock=parseInt(document.getElementById("pStock").value)||50;
 let whole=parseInt(document.getElementById("pWhole").value)||0;
 let sell=parseInt(document.getElementById("pSell").value)||0;
 let minP=parseInt(document.getElementById("pMinProfit").value)||1000;
 let maxP=parseInt(document.getElementById("pMaxProfit").value)||30000;
 let img=document.getElementById("pImage").value.trim()||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400";
 let imgsText=document.getElementById("pImages").value.trim();
 let specs=document.getElementById("pSpecs").value.trim();
 let promo=document.getElementById("pPromo").value.trim();

 if(!name||!whole||!sell)return alert("املأ الاسم والاسعار");

 let images=[img];
 if(imgsText){imgsText.split("\n").forEach(l=>{let t=l.trim(); if(t) images.push(t);});}

 let product={id:id?parseInt(id):Date.now(),n:name,whole,sell,c:cat,i:img,images,s,minProfit:minP,maxProfit:maxP,specs,promo};

 let custom=getCustomOnly();
 if(id){
   let idx=custom.findIndex(p=>p.id==id);
   if(idx>=0) custom[idx]=product;
   else custom.push(product);
 } else {
   custom.push(product);
 }
 localStorage.setItem("mazaya_custom_products",JSON.stringify(custom));
 alert("تم الحفظ ✅");
 clearForm();
 renderAdmin();
 updateStats();
}

function editProduct(id){
 let all=getAllProducts();
 let p=all.find(x=>x.id==id);
 if(!p)return;
 document.getElementById("editId").value=p.id;
 document.getElementById("pName").value=p.n;
 document.getElementById("pCat").value=p.c;
 document.getElementById("pStock").value=p.s;
 document.getElementById("pWhole").value=p.whole;
 document.getElementById("pSell").value=p.sell;
 document.getElementById("pMinProfit").value=p.minProfit||1000;
 document.getElementById("pMaxProfit").value=p.maxProfit||30000;
 document.getElementById("pImage").value=p.i;
 document.getElementById("pImages").value=(p.images||[]).slice(1).join("\n");
 document.getElementById("pSpecs").value=p.specs||"";
 document.getElementById("pPromo").value=p.promo||"";
 document.getElementById("saveBtn").innerText="تحديث المنتج ✏️";
 window.scrollTo({top:0,behavior:'smooth'});
}

function deleteProduct(id){
 if(!confirm("متأكد تحذف؟"))return;
 let custom=getCustomOnly();
 if(custom.find(p=>p.id==id)){
   custom=custom.filter(p=>p.id!=id);
   localStorage.setItem("mazaya_custom_products",JSON.stringify(custom));
 } else {
   alert("هذا منتج افتراضي - ما ينحذف، تكدر تعدل عليه فقط");
   return;
 }
 renderAdmin();
 updateStats();
}

function clearForm(){
 document.getElementById("editId").value="";
 document.getElementById("pName").value="";
 document.getElementById("pStock").value="";
 document.getElementById("pWhole").value="";
 document.getElementById("pSell").value="";
 document.getElementById("pMinProfit").value="";
 document.getElementById("pMaxProfit").value="";
 document.getElementById("pImage").value="";
 document.getElementById("pImages").value="";
 document.getElementById("pSpecs").value="";
 document.getElementById("pPromo").value="";
 document.getElementById("saveBtn").innerText="حفظ المنتج ✅";
}

function renderAdmin(){
 let q=(document.getElementById("searchAdmin").value||"").toLowerCase();
 let all=getAllProducts().filter(p=>p.n.toLowerCase().includes(q));
 document.getElementById("adminGrid").innerHTML=all.map(p=>`
 <div class="card-heba rounded-2xl p-3 flex gap-3">
  <img src="${p.i}" class="w-20 h-20 rounded-xl bg-[#0f0f17] object-contain p-1 border border-white/5">
  <div class="flex-1">
    <div class="font-black text-[11px]">${p.n}</div>
    <div class="text-[10px] opacity-60 mt-1">${p.c} • 📦 ${p.s} • جملة ${p.whole.toLocaleString()} • بيع ${p.sell.toLocaleString()}</div>
    <div style="direction:ltr" class="flex gap-2 mt-2 text-[9px]">
      <span class="bg-[#ec4899]/15 border border-[#ec4899]/20 px-2 py-1 rounded-full text-[#ec4899]">اعلى ربح ${(p.sell-p.whole).toLocaleString()}</span>
      <span class="bg-[#7c3aed]/15 border border-[#7c3aed]/20 px-2 py-1 rounded-full text-[#a78bfa]">الحد ${p.minProfit||1000}-${p.maxProfit||30000}</span>
    </div>
  </div>
  <div class="flex flex-col gap-2">
    <button onclick="editProduct(${p.id})" class="w-8 h-8 glass rounded-full text-[12px]">✏️</button>
    <button onclick="deleteProduct(${p.id})" class="w-8 h-8 bg-red-500/10 border border-red-500/20 rounded-full text-[12px]">🗑️</button>
  </div>
 </div>
 `).join("")||"<div class='text-center py-10 opacity-30 text-[12px]'>لا يوجد منتجات</div>";
}

function updateStats(){
 let all=getAllProducts();
 document.getElementById("totalProducts").innerText=all.length;
 let orders=JSON.parse(localStorage.getItem("mazaya_orders")||"[]");
 document.getElementById("totalOrdersDash").innerText=orders.length;
 let profit=parseInt(localStorage.getItem("mazaya_total_profit")||"0");
 let p2=0; orders.forEach(o=>{if(o.profit) p2+=o.profit;});
 if(p2>0) profit=p2;
 document.getElementById("totalProfitDash").innerText=profit.toLocaleString()+" د.ع";
}

function exportData(){
 let data=localStorage.getItem("mazaya_custom_products");
 if(!data) return alert("لا يوجد");
 let blob=new Blob([data],{type:"application/json"});
 let url=URL.createObjectURL(blob);
 let a=document.createElement("a"); a.href=url; a.download="mazaya-products.json"; a.click();
}

renderAdmin(); updateStats();
</script>
</body>
</html>
