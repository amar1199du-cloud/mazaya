<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body style="font-family:Cairo;background:#0f0e1f;color:white;padding:12px;"><div style="max-width:600px;margin:auto;"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><a href="index.html" style="background:white;color:black;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:bold;text-decoration:none;">← المتجر</a><div id="totalCount" style="background:#7c3aed;padding:4px 12px;border-radius:20px;font-size:12px;">0 منتج</div></div><div style="background:#1c1a33;padding:16px;border-radius:16px;margin-bottom:16px;"><div style="font-weight:bold;font-size:14px;margin-bottom:8px;">⚙️ حدد الادنى والاكثر للكل</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><input id="globalMin" type="number" value="3000" placeholder="اقل ربح" style="padding:12px;border-radius:12px;background:#211f3f;border:1px solid #333;color:white;font-size:12px;"><input id="globalMax" type="number" value="15000" placeholder="اكثر ربح" style="padding:12px;border-radius:12px;background:#211f3f;border:1px solid #333;color:white;font-size:12px;"></div><button onclick="applyGlobal()" style="width:100%;margin-top:10px;background:#7c3aed;padding:12px;border-radius:12px;font-weight:bold;border:none;color:white;">طبق على الكل ✅</button></div><div style="background:#1c1a33;padding:16px;border-radius:16px;margin-bottom:16px;"><div style="font-weight:bold;font-size:14px;margin-bottom:8px;">📥 استيراد Excel</div><input type="file" id="excelFile" accept=".xlsx,.xls,.csv" style="width:100%;padding:8px;background:#211f3f;border-radius:12px;font-size:12px;margin-bottom:8px;"><button onclick="importExcel()" style="width:100%;background:#16a34a;padding:12px;border-radius:12px;font-weight:bold;border:none;color:white;">استيراد 📥</button><div style="display:flex;gap:8px;margin-top:8px;"><button onclick="downloadTemplate()" style="flex:1;background:#211f3f;padding:10px;border-radius:12px;font-size:10px;border:1px solid #333;color:white;">📄 نموذج</button><button onclick="exportProducts()" style="flex:1;background:#211f3f;padding:10px;border-radius:12px;font-size:10px;border:1px solid #333;color:white;">📤 تصدير</button></div></div><div style="background:#1c1a33;padding:16px;border-radius:16px;margin-bottom:16px;"><div style="font-weight:bold;font-size:14px;margin-bottom:8px;">➕ اضافة منتج</div><input id="pName" placeholder="اسم المنتج" style="width:100%;padding:12px;border-radius:12px;background:#211f3f;border:1px solid #333;color:white;font-size:12px;margin-bottom:8px;"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;"><input id="pWhole" type="number" placeholder="جملة" style="padding:12px;border-radius:12px;background:#211f3f;border:1px solid #333;color:white;font-size:12px;"><input id="pSell" type="number" placeholder="بيع" style="padding:12px;border-radius:12px;background:#211f3f;border:1px solid #333;color:white;font-size:12px;"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;"><input id="pMin" type="number" placeholder="اقل ربح 3000" style="padding:12px;border-radius:12px;background:#4a0000;border:1px solid red;color:white;font-size:12px;"><input id="pMax" type="number" placeholder="اكثر ربح 15000" style="padding:12px;border-radius:12px;background:#003d00;border:1px solid green;color:white;font-size:12px;"></div><input id="pCat" placeholder="الصنف - الكترونيات" value="الكترونيات" style="width:100%;padding:12px;border-radius:12px;background:#211f3f;border:1px solid #333;color:white;font-size:12px;margin-bottom:8px;"><input id="pImg" placeholder="رابط الصورة" style="width:100%;padding:12px;border-radius:12px;background:#211f3f;border:1px solid #333;color:white;font-size:12px;margin-bottom:8px;"><button onclick="addOne()" style="width:100%;background:#7c3aed;padding:14px;border-radius:12px;font-weight:900;border:none;color:white;">اضافة ✅</button></div><div style="display:flex;gap:8px;margin-bottom:12px;"><input id="searchBox" oninput="render()" placeholder="ابحث..." style="flex:1;padding:12px;border-radius:12px;background:#1c1a33;border:1px solid #333;color:white;font-size:12px;"><select id="filterCat" onchange="render()" style="padding:12px;border-radius:12px;background:#1c1a33;border:1px solid #333;color:white;font-size:12px;"><option value="">الكل</option></select></div><div id="list"></div></div><script>function getP(){return JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");}function saveP(p){localStorage.setItem("mazaya_custom_products",JSON.stringify(p));render();}function addOne(){let n=document.getElementById("pName").value.trim();let w=parseInt(document.getElementById("pWhole").value)||0;let s=parseInt(document.getElementById("pSell").value)||0;let minP=parseInt(document.getElementById("pMin").value)||3000;let maxP=parseInt(document.getElementById("pMax").value)||15000;let c=document.getElementById("pCat").value||"الكترونيات";let img=document.getElementById("pImg").value.trim()||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400";if(!n||!w){alert("اسم وجملة");return;}let arr=getP();arr.push({id:Date.now(),n,whole:w,sell:s||w+minP,c,i:img,s:50,minProfit:minP,maxProfit:maxP});saveP(arr);document.getElementById("pName").value="";alert("تم ✅");}function applyGlobal(){let minP=parseInt(document.getElementById("globalMin").value)||0;let maxP=parseInt(document.getElementById("globalMax").value)||0;if(!confirm("تطبق "+minP+" و "+maxP+" على الكل؟"))return;let arr=getP();arr=arr.map(p=>({...p,minProfit:minP,maxProfit:maxP}));saveP(arr);alert("تم على "+arr.length);}function importExcel(){let file=document.getElementById("excelFile").files[0];if(!file){alert("اختار ملف");return;}let reader=new FileReader();reader.onload=function(e){let data=new Uint8Array(e.target.result);let wb=XLSX.read(data,{type:"array"});let sheet=wb.Sheets[wb.SheetNames[0]];let json=XLSX.utils.sheet_to_json(sheet);let arr=getP();let c=0;json.forEach(row=>{let name=row["الاسم"]||Object.values(row)[0];let whole=row["سعر الجملة"]||Object.values(row)[1];let sell=row["سعر البيع"]||Object.values(row)[2];let minP=row["اقل ربح"]||3000;let maxP=row["اكثر ربح"]||15000;let cat=row["الصنف"]||"جميع المنتجات";let img=row["رابط الصورة"]||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400";if(name&&whole){arr.push({id:Date.now()+c++,n:String(name),whole:parseInt(whole),sell:parseInt(sell)||parseInt(whole)+parseInt(minP),c:String(cat),i:String(img),s:50,minProfit:parseInt(minP),maxProfit:parseInt(maxP)});}});saveP(arr);alert("تم "+c);};reader.readAsArrayBuffer(file);}function downloadTemplate(){let data=[["الاسم","سعر الجملة","سعر البيع","اقل ربح","اكثر ربح","الصنف","رابط الصورة","الكمية"],["ميزان مطبخ",16500,25000,3000,10000,"اجهزة المطبخ","https://...jpg",100]];let ws=XLSX.utils.aoa_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"منتجات");XLSX.writeFile(wb,"نموذج.xlsx");}function exportProducts(){let arr=getP();if(!arr.length){alert("ماكو");return;}let ws=XLSX.utils.json_to_sheet(arr.map(p=>({"الاسم":p.n,"جملة":p.whole,"بيع":p.sell,"اقل ربح":p.minProfit,"اكثر ربح":p.maxProfit})));let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"منتجات");XLSX.writeFile(wb,"تصدير.xlsx");}function del(id){if(confirm("حذف؟"))saveP(getP().filter(x=>x.id!==id));}function render(){let arr=getP();let q=(document.getElementById("searchBox").value||"").toLowerCase();let filtered=arr.filter(p=>!q||p.n.toLowerCase().includes(q));document.getElementById("totalCount").innerText=arr.length+" منتج";document.getElementById("list").innerHTML=filtered.slice().reverse().map(p=>`<div style="background:#1c1a33;padding:12px;border-radius:12px;border:1px solid #2a2750;display:flex;gap:12px;margin-bottom:8px;"><img src="${p.i}" style="width:48px;height:48px;border-radius:12px;object-fit:cover;"><div style="flex:1;font-size:11px;"><div style="font-weight:bold;">${p.n}</div><div style="opacity:0.6;font-size:10px;margin-top:4px;">${p.c} | جملة ${p.whole} | ادنى ${p.minProfit} | اكثر ${p.maxProfit}</div></div><button onclick="del(${p.id})" style="color:#ff4444;background:none;border:none;font-size:16px;">✕</button></div>`).join("")||"<div style='text-align:center;opacity:0.3;font-size:12px;padding:40px 0;'>ماكو منتجات</div>";}render();</script></body></html>
