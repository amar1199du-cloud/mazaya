<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم - 1000 منتج | HEBA STORE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{font-family:Cairo}
body{background:#0a0a0f}
.glass{background:rgba(255,255,255,0.07);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.09)}
.card-heba{background:linear-gradient(145deg,#1e1e2e,#171721);border:1px solid rgba(124,58,237,0.14)}
.text-gradient{background:linear-gradient(90deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.banner-heba{background:linear-gradient(135deg,#1e0f4a 0%,#3b1a8a 35%,#5b21b6 70%,#7c3aed 100%);border:1px solid rgba(168,85,247,0.25)}
input,textarea,select{background:#171721!important;border:1px solid rgba(255,255,255,0.1)!important;color:white!important}
.upload-box{border:2px dashed rgba(124,58,237,0.3);background:rgba(124,58,237,0.06)}
</style>
</head>
<body class="text-white">
<div class="max-w-[600px] mx-auto min-h-screen pb-10">
<div style="direction:ltr" class="sticky top-0 z-40 glass p-4 flex justify-between items-center">
<div style="direction:rtl" class="flex items-center gap-2.5"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#ec4899] to-[#7c3aed] flex items-center justify-center font-black">M</div><div><div class="font-black text-[13px] text-gradient">لوحة 1000 منتج</div><div class="text-[8px] opacity-60">IndexedDB - 500MB</div></div></div>
<div style="direction:rtl" class="flex items-center gap-2"><div class="text-right"><div class="font-black text-[14px]">عمار</div><div class="text-[10px] opacity-50">👑</div></div><div class="w-9 h-9 rounded-full bg-[#1e1e2e] border border-white/10 flex items-center justify-center">👤</div></div>
</div>
<div class="p-4 space-y-4">
<div class="banner-heba rounded-[20px] p-4 flex justify-between"><div><div class="font-black text-[14px]">🔥 نظام 1000 منتج مفعل</div><div class="text-[11px] opacity-80 mt-1">يدعم 12 صورة × 1000 منتج = 12000 صورة</div><div id="storageInfo" class="text-[9px] mt-2 bg-black/30 px-2 py-1 rounded-full inline-block">جاري حساب المساحة...</div></div><div class="text-[36px]">🚀</div></div>
<div class="grid grid-cols-3 gap-3">
<div class="glass rounded-2xl p-4 text-center"><div class="font-black text-[#a78bfa]" id="totalProducts">0</div><div class="text-[9px] opacity-60">المنتجات</div></div>
<div class="glass rounded-2xl p-4 text-center"><div class="font-black text-green-400" id="totalImages">0</div><div class="text-[9px] opacity-60">الصور</div></div>
<div class="glass rounded-2xl p-4 text-center"><div class="font-black text-[#ec4899]" id="totalProfitDash">0</div><div class="text-[9px] opacity-60">الارباح</div></div>
</div>
<div class="glass rounded-[20px] p-5">
<div class="flex justify-between mb-4"><div class="font-black text-[13px]">➕ اضافة منتج (1000)</div><button onclick="clearForm()" class="text-[10px] opacity-50">مسح</button></div>
<input type="hidden" id="editId">
<div class="space-y-3">
<input id="pName" placeholder="اسم المنتج" class="w-full p-3 rounded-xl text-[12px]">
<div class="grid grid-cols-2 gap-3"><select id="pCat" class="w-full p-3 rounded-xl text-[12px]"><option>الكترونيات</option><option>اجهزة المنزل</option><option>اجهزة المطبخ</option><option>منتجات العنايه</option><option>العاب</option><option>ادوات السيارات</option></select><input id="pStock" type="tel" inputmode="numeric" placeholder="الكمية" class="w-full p-3 rounded-xl text-[12px]"></div>
<div class="grid grid-cols-2 gap-3"><input id="pWhole" type="tel" inputmode="numeric" placeholder="سعر الجملة *" class="w-full p-3 rounded-xl text-[12px] font-bold"><input id="pSell" type="tel" inputmode="numeric" placeholder="سعر البيع *" class="w-full p-3 rounded-xl text-[12px] font-bold"></div>
<div class="grid grid-cols-2 gap-3"><input id="pMinProfit" type="tel" inputmode="numeric" placeholder="اقل ربح 1000" class="w-full p-3 rounded-xl text-[12px]"><input id="pMaxProfit" type="tel" inputmode="numeric" placeholder="اعلى ربح 30000" class="w-full p-3 rounded-xl text-[12px]"></div>
<div class="space-y-3">
<div class="flex justify-between items-center"><div class="font-bold text-[11px]">📸 الصور <span id="imgCount" class="text-[#a78bfa]">(0/12)</span></div><label for="fileInput" class="text-[10px] bg-[#7c3aed]/20 border border-[#7c3aed]/30 px-3 py-1 rounded-full cursor-pointer">+ تحديد 12 مرة وحدة</label></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<div id="uploadBox" class="upload-box rounded-2xl p-6 text-center cursor-pointer"><div class="text-[28px]">🖼️</div><div class="font-black text-[11px] mt-2">حدد 12 صورة مرة وحدة</div><div class="text-[9px] opacity-50 mt-1">دوسة طويلة وحدد الكل - IndexedDB 500MB</div></div>
<div id="previewGrid" class="grid grid-cols-4 gap-2"></div>
<input id="pImageUrl" placeholder="او رابط صورة (اختياري)" class="w-full p-3 rounded-xl text-[11px] opacity-60">
<div id="err" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl text-[11px]"></div>
</div>
<div class="grid grid-cols-2 gap-3"><textarea id="pSpecs" placeholder="المواصفات" class="w-full p-3 rounded-xl text-[11px] h-[90px]"></textarea><textarea id="pPromo" placeholder="الوصف الترويجي" class="w-full p-3 rounded-xl text-[11px] h-[90px]"></textarea></div>
<button onclick="saveProduct()" id="saveBtn" class="w-full bg-gradient-to-r from-[#7c3aed] to-[#ec4899] py-4 rounded-xl font-black text-[13px]">حفظ في النظام الجديد ✅</button>
</div>
</div>
<div class="flex justify-between px-1"><div class="font-black text-[12px]">📦 كل المنتجات (1000)</div><input id="searchAdmin" oninput="renderAdmin()" placeholder="بحث..." class="p-2 px-3 rounded-full text-[11px] w-[120px]"></div>
<div id="adminGrid" class="grid grid-cols-1 gap-3"></div>
</div>
</div>
<script>
let defaultProducts=[
{id:1,n:"ميزان مطبخ رقمي ذكي",whole:12000,sell:13000,c:"اجهزة المطبخ",i:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400",images:["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"],s:85,minProfit:1000,maxProfit:30000,specs:"• يتحمل حتى 10 كغم",promo:"ميزان يجنن!"},
{id:2,n:"سماعات ريلمي",whole:15000,sell:16000,c:"الكترونيات",i:"https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400",images:["https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400"],s:50,minProfit:1000,maxProfit:20000,specs:"• صوت نقي",promo:"سماعات اصلية!"}
];
let selectedImages=[];
let db;
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open("mazaya1000",2);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("products")) d.createObjectStore("products",{keyPath:"id"});};r.onsuccess=e=>{db=e.target.result;res(db);};r.onerror=rej;});}
function toNum(v){if(!v)return 0;v=v.toString().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^0-9]/g,'');return parseInt(v)||0;}
function compressImage(file){return new Promise(res=>{let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let max=500;let w=img.width,h=img.height;if(w>h){if(w>max){h*=max/w;w=max;}}else{if(h>max){w*=max/h;h=max;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.4));};img.src=e.target.result;};r.readAsDataURL(file);});}
async function migrateOld(){
 let old=JSON.parse(localStorage.getItem("mazaya_custom_products")||"[]");
 if(old.length>0){
  await openDB();
  let tx=db.transaction("products","readwrite");let store=tx.objectStore("products");
  for(let p of old){store.put(p);}
  tx.oncomplete=()=>{console.log("migrated",old.length); localStorage.removeItem("mazaya_custom_products"); renderAdmin();}
 }
}
async function getAllCustom(){await openDB();return new Promise(res=>{let tx=db.transaction("products","readonly");let store=tx.objectStore("products");let r=store.getAll();r.onsuccess=()=>res(r.result);});}
async function getAllProducts(){let custom=await getAllCustom();return [...defaultProducts,...custom];}
async function handleFiles(files){
 let remain=12-selectedImages.length;
 if(files.length>remain){alert("بقالك مكان لـ "+remain+" بس");files=Array.from(files).slice(0,remain);}
 for(let f of Array.from(files)){if(!f.type.startsWith("image/"))continue;let comp=await compressImage(f);selectedImages.push(comp);}
 renderPreview();
}
function renderPreview(){
 document.getElementById("imgCount").innerText=`(${selectedImages.length}/12)`;
 document.getElementById("previewGrid").innerHTML=selectedImages.map((img,i)=>`
  <div class="relative card-heba rounded-xl overflow-hidden aspect-square">
   <img src="${img}" class="w-full h-full object-cover">
   <button type="button" onclick="removeImage(${i})" class="absolute top-1 right-1 w-7 h-7 bg-red-500 rounded-full text-[12px] flex items-center justify-center font-black z-20">✕</button>
   <div class="absolute bottom-1 left-1 bg-black/80 text-[7px] px-2 py-1 rounded-full">${i==0?'⭐ رئيسية':i+1}</div>
   ${i!=0?`<button type="button" onclick="makeMain(${i})" class="absolute bottom-1 right-1 bg-[#7c3aed] text-[6px] px-2 py-1 rounded-full z-20">رئيسية</button>`:''}
  </div>`).join("");
}
function removeImage(i){selectedImages.splice(i,1);renderPreview();}
function makeMain(i){let x=selectedImages.splice(i,1)[0];selectedImages.unshift(x);renderPreview();}
async function saveProduct(){
 let id=document.getElementById("editId").value;
 let name=document.getElementById("pName").value.trim();
 let cat=document.getElementById("pCat").value;
 let stock=toNum(document.getElementById("pStock").value)||50;
 let whole=toNum(document.getElementById("pWhole").value);
 let sell=toNum(document.getElementById("pSell").value);
 let minP=toNum(document.getElementById("pMinProfit").value)||1000;
 let maxP=toNum(document.getElementById("pMaxProfit").value)||30000;
 let specs=document.getElementById("pSpecs").value.trim();
 let promo=document.getElementById("pPromo").value.trim();
 let urlImg=document.getElementById("pImageUrl").value.trim();
 let err=document.getElementById("err");err.classList.add("hidden");
 if(!name){err.innerText="❌ اسم المنتج";err.classList.remove("hidden");return;}
 if(!whole){err.innerText="❌ سعر الجملة";err.classList.remove("hidden");return;}
 if(!sell){err.innerText="❌ سعر البيع";err.classList.remove("hidden");return;}
 let images=[...selectedImages]; if(urlImg) images.unshift(urlImg);
 if(images.length==0){err.innerText="❌ ضيف صورة";err.classList.remove("hidden");return;}
 await openDB();
 let product={id:id?parseInt(id):Date.now(),n:name,whole,sell,c:cat,i:images[0],images,s:stock,minProfit:minP,maxProfit:maxP,specs,promo};
 let tx=db.transaction("products","readwrite");tx.objectStore("products").put(product);
 tx.oncomplete=()=>{alert("تم الحفظ ✅ - النظام الجديد يشيل 1000 منتج");clearForm();renderAdmin();updateStats();};
 tx.onerror=()=>{err.innerText="❌ خطأ بالحفظ";err.classList.remove("hidden");};
}
async function editProduct(id){let all=await getAllProducts();let p=all.find(x=>x.id==id);if(!p)return;document.getElementById("editId").value=p.id;document.getElementById("pName").value=p.n;document.getElementById("pCat").value=p.c;document.getElementById("pStock").value=p.s;document.getElementById("pWhole").value=p.whole;document.getElementById("pSell").value=p.sell;document.getElementById("pMinProfit").value=p.minProfit||1000;document.getElementById("pMaxProfit").value=p.maxProfit||30000;document.getElementById("pSpecs").value=p.specs||"";document.getElementById("pPromo").value=p.promo||"";selectedImages=[...(p.images||[p.i])];renderPreview();document.getElementById("saveBtn").innerText="تحديث ✏️";window.scrollTo({top:0,behavior:'smooth'});}
async function deleteProduct(id){if(!confirm("تحذف؟"))return;await openDB();let tx=db.transaction("products","readwrite");tx.objectStore("products").delete(id);tx.oncomplete=()=>{renderAdmin();updateStats();};}
function clearForm(){document.getElementById("editId").value="";["pName","pStock","pWhole","pSell","pMinProfit","pMaxProfit","pSpecs","pPromo","pImageUrl"].forEach(i=>document.getElementById(i).value="");selectedImages=[];renderPreview();document.getElementById("err").classList.add("hidden");document.getElementById("saveBtn").innerText="حفظ في النظام الجديد ✅";}
async function renderAdmin(){let q=(document.getElementById("searchAdmin").value||"").toLowerCase();let all=await getAllProducts();let filtered=all.filter(p=>p.n.toLowerCase().includes(q));document.getElementById("adminGrid").innerHTML=filtered.map(p=>`<div class="card-heba rounded-2xl p-3 flex gap-3"><img src="${p.i}" class="w-20 h-20 rounded-xl bg-[#0f0f17] object-cover"><div class="flex-1"><div class="font-black text-[11px]">${p.n}</div><div class="text-[10px] opacity-60 mt-1">📸 ${p.images?p.images.length:1} • ${p.c} • ${p.whole.toLocaleString()} د.ع</div></div><div class="flex flex-col gap-2"><button onclick="editProduct(${p.id})" class="w-8 h-8 glass rounded-full">✏️</button><button onclick="deleteProduct(${p.id})" class="w-8 h-8 bg-red-500/10 border border-red-500/20 rounded-full">🗑️</button></div></div>`).join("");updateStats();}
async function updateStats(){let all=await getAllProducts();document.getElementById("totalProducts").innerText=all.length;let totalImgs=all.reduce((s,p)=>s+(p.images?p.images.length:1),0);document.getElementById("totalImages").innerText=totalImgs;let profit=parseInt(localStorage.getItem("mazaya_total_profit")||"0");document.getElementById("totalProfitDash").innerText=profit.toLocaleString()+" د.ع";if(navigator.storage&&navigator.storage.estimate){let est=await navigator.storage.estimate();let used=((est.usage||0)/1024/1024).toFixed(1);let quota=((est.quota||0)/1024/1024).toFixed(0);document.getElementById("storageInfo").innerText=`مستخدم ${used}MB من ${quota}MB - يكفي 1000 منتج`;}}
document.getElementById('fileInput').addEventListener('change',function(){handleFiles(this.files);this.value='';});
document.getElementById('uploadBox').addEventListener('click',()=>document.getElementById('fileInput').click());
(async()=>{await openDB();await migrateOld();renderAdmin();})();
</script>
</body>
</html>
